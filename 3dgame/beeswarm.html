<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bee Swarm Simulator 再現版</title>
<style>
:root{--hny:#ffc93c;--pan:rgba(18,20,28,.86);--line:rgba(255,255,255,.14);--sa-t:env(safe-area-inset-top,0px);--sa-b:env(safe-area-inset-bottom,0px);--sa-l:env(safe-area-inset-left,0px);--sa-r:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#87c8f0;font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
#c{position:fixed;inset:0}
canvas{display:block}
.hud{position:fixed;pointer-events:none;z-index:5;text-shadow:0 2px 0 rgba(0,0,0,.45)}
#top{top:calc(8px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
.pill{background:rgba(0,0,0,.45);border-radius:12px;padding:5px 12px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:6px;white-space:nowrap}
#honey{color:var(--hny)}
#pbar{width:210px;height:22px;border-radius:11px;background:rgba(0,0,0,.45);position:relative;overflow:hidden}
#pbar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffe37a,#f2b52b);width:0}
#pbar span{position:absolute;inset:0;text-align:center;font-size:13px;line-height:22px;font-weight:800}
#pbar.full i{background:linear-gradient(#ff8a7a,#e0453a)}
#buffs{top:calc(42px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:92vw}
.bf{width:38px;height:38px;border-radius:7px;background:rgba(0,0,0,.5);position:relative;font-size:20px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.25)}
.bf b{position:absolute;right:1px;bottom:-1px;font-size:11px}
.bf u{position:absolute;left:0;bottom:0;height:3px;background:#fff8;text-decoration:none}
#menu{left:calc(8px + var(--sa-l));top:calc(90px + var(--sa-t));display:flex;flex-direction:column;gap:6px;pointer-events:auto}
.mb{width:50px;height:50px;border-radius:12px;background:rgba(0,0,0,.5);border:2px solid rgba(255,255,255,.3);font-size:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;position:relative}
.mb small{position:absolute;bottom:1px;font-size:9px;font-weight:800}
.mb:active{transform:scale(.94)}
#hp{left:calc(66px + var(--sa-l));top:calc(92px + var(--sa-t));width:120px;height:12px;border-radius:6px;background:rgba(0,0,0,.5);overflow:hidden;display:none}
#hp i{display:block;height:100%;background:#5fe36a;width:100%}
#zone{top:calc(66px + var(--sa-t));left:50%;transform:translateX(-50%);font-size:14px;font-weight:800;opacity:.92}
#prompt{bottom:calc(120px + var(--sa-b));left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);border-radius:10px;padding:8px 14px;font-weight:800;font-size:16px;display:none;pointer-events:auto;cursor:pointer}
#prompt kbd{background:#fff;color:#222;border-radius:5px;padding:0 6px;margin-right:6px;text-shadow:none}
#notes{right:calc(10px + var(--sa-r));bottom:calc(14px + var(--sa-b));display:flex;flex-direction:column;align-items:flex-end;gap:4px;max-width:min(420px,70vw)}
.nt{background:rgba(0,0,0,.55);border-radius:8px;padding:5px 10px;font-size:13px;font-weight:700;animation:nin .25s}
@keyframes nin{from{transform:translateX(30px);opacity:0}}
#big{top:30%;left:50%;transform:translate(-50%,-50%);font-size:34px;font-weight:900;text-align:center;display:none;color:#fff7c2}
.dn{position:fixed;pointer-events:none;z-index:4;font-weight:900;font-size:15px;text-shadow:0 2px 0 #0008,0 0 4px #0008;white-space:nowrap}
.lab{position:fixed;pointer-events:none;z-index:3;font-size:12px;font-weight:800;text-align:center;transform:translate(-50%,-100%);text-shadow:0 1px 0 #000,0 0 3px #000;white-space:nowrap}
.lab .hb{width:70px;height:7px;background:#0008;border-radius:4px;overflow:hidden;margin:2px auto 0}
.lab .hb i{display:block;height:100%;background:#ff5a4a}
/* パネル */
.dim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center}
.dim.on{display:flex}
.pan{background:var(--pan);border:2px solid var(--line);border-radius:16px;width:min(760px,96vw);max-height:min(88vh,88dvh);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 10px 40px #0008}
.pan h2{margin:0;padding:12px 16px;font-size:19px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.pan h2 .x{margin-left:auto;cursor:pointer;width:34px;height:34px;border-radius:9px;background:#e0453a;display:flex;align-items:center;justify-content:center;font-size:18px}
.pan .bd{overflow:auto;padding:12px 14px;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.tabs{display:flex;gap:6px;padding:8px 12px 0;flex-wrap:wrap}
.tab{padding:6px 12px;border-radius:9px;background:#ffffff18;cursor:pointer;font-weight:800;font-size:14px}
.tab.on{background:var(--hny);color:#2a1d00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.it{background:#ffffff10;border:2px solid #ffffff1c;border-radius:12px;padding:8px;cursor:pointer;position:relative;font-size:13px}
.it:hover{border-color:#ffffff55}
.it.sel{border-color:var(--hny)}
.it .ic{font-size:28px;line-height:34px}
.it .nm{font-weight:800;font-size:14px}
.it .ct{position:absolute;right:8px;top:6px;font-weight:900;font-size:15px;color:var(--hny)}
.it .ds{opacity:.85;font-size:12px;margin-top:2px}
.it.lock{opacity:.5}
.btn{display:inline-block;padding:8px 14px;border-radius:10px;background:var(--hny);color:#2a1d00;font-weight:900;cursor:pointer;border:0;font-size:15px;font-family:inherit;margin:3px}
.btn.g{background:#5fd36a;color:#0c2a10}.btn.b{background:#55a8ff;color:#06203d}.btn.r{background:#ff6a5a;color:#3a0702}.btn.d{background:#ffffff24;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cost{color:var(--hny);font-weight:900}
.small{font-size:12px;opacity:.8}
.stat{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px}
.stat b{text-align:right}
/* ハイブ */
.hive{display:grid;grid-template-columns:repeat(5,64px);gap:4px 6px;justify-content:center;padding:8px 0}
.cell{width:64px;height:72px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#c8902a;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-size:11px;font-weight:900}
.cell:nth-child(5n+2),.cell:nth-child(5n+4){transform:translateY(36px)}
.cell.empty{background:#6a5530}
.cell.sel{outline:3px solid #fff;filter:brightness(1.25)}
.cell .fc{width:36px;height:30px;border-radius:50%/60%;display:flex;align-items:center;justify-content:center;font-size:18px}
.cell .lv{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;background:#0007;border-radius:5px;padding:0 4px}
.cell .gf{position:absolute;bottom:9px;font-size:12px}
.cell .zz{position:absolute;top:22px;right:8px;font-size:11px}
/* 会話 */
#dlg{position:fixed;left:50%;bottom:calc(20px + var(--sa-b));transform:translateX(-50%);width:min(680px,94vw);background:var(--pan);border:2px solid var(--line);border-radius:16px;z-index:21;padding:12px 16px;display:none}
#dlg .who{font-weight:900;color:var(--hny);font-size:16px}
#dlg .tx{font-size:15px;margin:6px 0 8px;line-height:1.55}
/* スマホ操作 */
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
body.touch #touch{display:block}
#stick{position:absolute;left:calc(24px + var(--sa-l));bottom:calc(30px + var(--sa-b));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);pointer-events:auto}
#stick i{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.45)}
.tb{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(0,0,0,.4);border:3px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:28px;pointer-events:auto;font-weight:900}
#tJump{right:calc(24px + var(--sa-r));bottom:calc(30px + var(--sa-b))}
#tTool{right:calc(104px + var(--sa-r));bottom:calc(52px + var(--sa-b));width:84px;height:84px;font-size:34px}
#tUse{right:calc(40px + var(--sa-r));bottom:calc(120px + var(--sa-b));width:58px;height:58px;font-size:15px;display:none}
body.touch #notes{bottom:calc(190px + var(--sa-b))}
/* 横向きスマホなど、高さが低い画面：メニューを2列にしてスティックと重ならないように */
@media (max-height:520px){#menu{top:calc(8px + var(--sa-t));display:grid;grid-template-columns:repeat(2,42px);gap:4px}.mb{width:42px;height:42px;font-size:19px;border-radius:10px}.mb small{font-size:8px}
 #stick{width:116px;height:116px;bottom:calc(16px + var(--sa-b))}#stick i{left:33px;top:33px}#tJump{bottom:calc(16px + var(--sa-b))}#tTool{bottom:calc(36px + var(--sa-b))}body.touch #notes{bottom:calc(150px + var(--sa-b));max-width:min(360px,46vw)}#hp{left:calc(104px + var(--sa-l));top:calc(14px + var(--sa-t))}}
#boot{position:fixed;inset:0;z-index:50;background:linear-gradient(#ffd75e,#f2a516);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3a2400;text-shadow:none}
#boot h1{font-size:34px;margin:0 0 4px}
#boot p{margin:4px;font-weight:700}
#bootGo{margin-top:18px;font-size:20px;padding:12px 30px;border-radius:14px;background:#3a2400;color:#ffd75e;border:0;font-weight:900;font-family:inherit;cursor:pointer;visibility:hidden}
.bar2{height:8px;width:min(320px,80vw);border-radius:4px;background:#0002;overflow:hidden}
.bar2 i{display:block;height:100%;background:#3a2400;width:0}
</style>
</head>

// (x,z)でいちばん高い床・建物の上
function topAt(x,z){let best=0;for(const s of SURF){if(x<s.x0||x>s.x1||z<s.z0||z>s.z1)continue;const t=surfTop(s,x,z);if(t>best)best=t}
  for(const b of SOLID){if(b.off||x<b.x0||x>b.x1||z<b.z0||z>b.z1)continue;if(b.y1>best)best=b.y1}return best}
let camD=14;
function updCam(dt){const tx=PL.x,ty=PL.y+1.8,tz=PL.z;
  // 崖や建物にカメラがうまらないよう、間にあるときは近づける（本家のカメラと同じ）
  const ux=Math.sin(CAM.yaw)*Math.cos(CAM.pitch),uy=Math.sin(CAM.pitch),uz=Math.cos(CAM.yaw)*Math.cos(CAM.pitch);let d=CAM.dist;
  for(let i=1;i<=16;i++){const f=i/16*CAM.dist;if(topAt(tx+ux*f,tz+uz*f)>ty+uy*f-.5){d=Math.max(1.5,f-1);break}}
  camD=d<camD?d:lerp(camD,d,Math.min(1,dt*4));d=camD;
  const cx=tx+ux*d,cy=ty+uy*d,cz=tz+uz*d;
  cam.position.set(cx,Math.max(cy,groundAt(cx,cz,cy+50)+.6),cz);cam.lookAt(tx,ty,tz);
  sun.position.set(PL.x+40,PL.y+80,PL.z+20);sun.target.position.set(PL.x,PL.y,PL.z);sky.position.set(PL.x,0,PL.z)}

   if(id==='gumdropshop')el.appendChild(buyRow('🍬 ガムドロップ ×3',n=>n,'ticket',n=>give('gumdrops',n*3),[1,10,100]));

   if(id==='tickettent'){for(const [k,p] of[['silveregg',50],['goldegg',100],['diamondegg',400],['mythicegg',2500],['puppyegg',500],['photonegg',500],['tabbyegg',500],['festiveegg',500],['crimsonegg',250],['cobaltegg',250],['startreat',1000]])
       el.appendChild(buyRow(ITEMS[k].ic+' '+ITEMS[k].jp+'<div class="ds">'+ITEMS[k].d+'</div>',n=>p*n,'ticket',n=>give(k,n)))}
   if(id==='blender'){el.appendChild(H('div',{className:'small',textContent:'材料を入れて素材を作ります（本家と同じレシピ。この版では待ち時間なしで作れます）'}));const g=H('div',{className:'grid'});el.appendChild(g);
     for(const [out,ing] of BLENDER){const c=H('div',{className:'it'});c.innerHTML=`<div class="ic">${ITEMS[out].ic}</div><div class="nm">${ITEMS[out].jp}</div><div class="ds">${itemCost(0,ing)}</div>`;
       c.appendChild(btn('作る',()=>{if(pay(0,ing)){give(out,1);SFX.buy();drawPanel()}else note('材料がたりない','#ff8a8a')},'d'));g.appendChild(c)}}})}
// 大砲で飛ぶ（ふわっと飛んで着地）
function cannonFly(x,z,y){const sx=PL.x,sz=PL.z,sy=PL.y,T=2.2;let t=0;G.flying={sx,sz,sy,x,z,y,T,t:0};big('🎯 発射！',.8)}
function updFlying(dt){const f=G.flying;if(!f)return false;f.t+=dt;const k=Math.min(1,f.t/f.T);PL.x=lerp(f.sx,f.x,k);PL.z=lerp(f.sz,f.z,k);PL.y=lerp(f.sy,f.y,k)+Math.sin(k*Math.PI)*40;PL.vy=0;pg.position.set(PL.x,PL.y,PL.z);
  if(k>=1){G.flying=null;teleport(f.x,f.z,f.y)}return true}
// ---- 使えるアイテム ----
function useItem(k){const it=ITEMS[k];if(!it||!it.use||inv(k)<1)return;const u=it.use;
  const need=()=>{if(!G.field){note('フィールドの中で使ってください');return false}return true};
  if(u==='gumdrop'){if(!need())return;take(k,1);const D=FL[G.field];for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++){const i=flowerAt(D,PL.x+dx,PL.z+dz);if(i>=0)D.goo[i]=12}fx.ring(PL.x,D.y,PL.z,3,0x5ad8c0);return}
  if(u==='glitter'){if(!need())return;take(k,1);addFieldBoost(G.field,1);return}
  if(u==='dice'){take(k,1);const f=k==='loadeddice'&&G.field?G.field:pick(FIELD_IDS.filter(x=>x!=='ant'));addFieldBoost(f,k==='fielddice'?1:2);return}
  if(u==='micro'){if(ST.pollen<=0){note('カバンに花粉がありません');return}take(k,1);note('🔋 '+fmt(instantConvert(ST.pollen))+'の花粉をハチミツにした');return}
  if(u==='suckle'){take(k,1);note('🌼 '+fmt(instantConvert(ST.pollen*.3+5000))+'の花粉をハチミツにした');return}
  if(u==='whirl'){take(k,1);PL.inRoom=null;teleport(HIVE_X(MY_HIVE),-1,0);return}
  if(u==='beans'){take(k,1);addBuff(pick(['haste','focus','boost_r','boost_b','boost_w','babylove','melody','rage']),3);return}
  const buffMap={stinger:'stinger',redextract:'redextract',blueextract:'blueextract',enzymes:'enzymes',oil:'oil',glue:'glue',tropical:'tropical',purple:'purple',smoothie:'smoothie'};
  if(buffMap[u]){take(k,1);addBuff(buffMap[u]);note(it.ic+' '+it.jp+'を使った')}}
// ハチのマスにアイテムを使う
function applyItem(k,slot){const it=ITEMS[k];if(!it)return;if(it.egg){if(!hatch(k,slot))note('このマスには使えません');return}if(it.jelly){if(!ST.hive[slot]){note('ハチのいるマスをえらんでください');return}useJelly(k,slot);return}
  if(it.bond){if(!ST.hive[slot]){note('ハチのいるマスをえらんでください');return}feed(k,slot,1)}}

function showDlg(who,text,buttons){const d=$('dlg');d.querySelector('.who').textContent=who;d.querySelector('.tx').innerHTML=text;const b=d.querySelector('.bt');b.innerHTML='';for(const [t,f,c] of buttons||[['とじる',hideDlg,'d']])b.appendChild(btn(t,()=>{f()},c));d.style.display='block'}

// ---- 10_quests.js ----
// ===================== クマのクエスト =====================
const BLACK_MAIN=QUEST_TABLE.black.filter(q=>!q.name.startsWith('Black Bear:')),BLACK_REP=QUEST_TABLE.black.filter(q=>q.name.startsWith('Black Bear:')).map(q=>Object.assign({},q,{name:q.name.replace('Black Bear: ','')}));
const CI={w:0,r:1,b:2};
function reqVal(r){switch(r.t){
  case 'pollen':{const ci=r.c?CI[r.c]:null;if(r.f&&ci!=null)return ST.st.fc[r.f+ci]||0;if(r.f)return ST.st.f[r.f]||0;if(ci!=null)return ST.st.c[ci];return ST.st.pollen}
  case 'kill':return ST.st.kill[r.m]||0;case 'feed':return ST.st.feed[r.i]||0;case 'use':return ST.st.use[r.i]||0;case 'token':return ST.st.tok[r.k]||0;
  case 'level':return hiveBees().filter(b=>b.lv>=r.l).length;case 'discover':return ST.disc.length}return 0}
const absReq=r=>r.t==='level'||r.t==='discover';
function reqProg(r,s0){const v=absReq(r)?reqVal(r):reqVal(r)-(s0||0);return[Math.max(0,v),r.n]}
function reqText(r){switch(r.t){
  case 'pollen':return (r.f?FIELDS[r.f].jp+'で':'')+(r.c?CNAME[r.c]:'')+'花粉を集める';case 'kill':return MOBS[r.m].jp+'をたおす';
  case 'feed':return 'ハチに'+(ITEMS[r.i]?ITEMS[r.i].jp:r.i)+'をあげる';case 'use':return (ITEMS[r.i]?ITEMS[r.i].jp:r.i)+'を使う';
  case 'level':return (r.n===1?'ハチ1匹':'ハチ'+r.n+'匹')+'をレベル'+r.l+'以上にする';case 'discover':return 'ハチを'+r.n+'種類見つける';
  case 'token':return (r.k==='any'?'能力':r.k==='bomb'?'ボム':r.k==='honeytok'?'ハチミツ':r.k==='treattok'?'おやつ':TOK_INFO[r.k]?TOK_INFO[r.k][0]:r.k)+'のトークンを集める'}return '?'}
function rewText(rw){return rw.map(([k,n])=>k==='honey'?'🍯'+fmt(n):k==='science'?'🔬サイエンスの強化':k==='polar'?'❄️ポーラーパワー':(ITEMS[k]?ITEMS[k].ic+ITEMS[k].jp:k)+'×'+fmt(n)).join('・')}
function questDone(cur){return cur.req.every((r,i)=>{const [v,n]=reqProg(r,cur.s0[i]);return v>=n})}
// ブラウンベア：本家と同じ計算で、こなした数が多いほど集める量が増える
function brownP(x,cnt){const r100=v=>Math.floor((v+.5)/100)*100;const base=r100(2500*x),inc=r100(5000*x),max=r100(1e13*x);const bp=base+cnt*inc;const s=cnt/1000<1?Math.pow(cnt/1000,4):Math.pow(cnt/1000,2);
  const req=bp+(max-bp)*s,iv=Math.pow(10,Math.max(Math.floor(Math.log10(Math.max(req,1)))-1,1));return Math.floor(req/iv+.5)*iv}
const BROWN_RJ=[[5,1],[15,2],[25,3],[30,5],[40,10],[50,20],[60,30],[75,50],[100,100],[110,125],[120,150],[125,250],[150,500],[200,750]];
const BROWN_MILE={5:[['fielddice',3]],10:[['microconverter',5]],15:[['fielddice',5]],20:[['bitterberry',25]],25:[['silveregg',1]],30:[['microconverter',5]],35:[['oil',1]],40:[['bitterberry',50]],45:[['enzymes',1]],50:[['goldegg',1]],55:[['magicbean',1]],60:[['bitterberry',50]],65:[['fielddice',5]],70:[['microconverter',5]],75:[['diamondegg',1]],80:[['microconverter',10]],85:[['tropicaldrink',1]],90:[['starjelly',1]],95:[['gumdrops',100]],100:[['mythicegg',1]]};
function brownQuest(cnt){const n=beeCount(),pool=BROWN_TABLE.filter(q=>q.min<=n&&q.req.every(r=>!r.f||FIELDS[r.f].zone<=n));const q=pick(pool.length?pool:BROWN_TABLE.slice(0,5));
  const req=q.req.map(r=>{const o={t:'pollen',n:brownP(r.x,cnt)};if(r.f)o.f=r.f;if(r.c)o.c=r.c;return o});
  const rj=(BROWN_RJ.find(([m])=>cnt<=m)||[0,1000])[1],honey=Math.round(req.reduce((s,r)=>s+r.n,0)*.35);
  const rw=[['honey',honey],['ticket',1],['royaljelly',rj]];if((cnt+1)%3===0)rw.push(['jellybeans',3]);for(const x of BROWN_MILE[cnt+1]||[])rw.push(x);
  return{name:q.name,req,rw,st:[]}}
function nextQuest(bear){const q=ST.q[bear]||(ST.q[bear]={i:0,cur:null,done:0});
  if(bear==='brown')return brownQuest(q.done);if(bear==='polar')return JSON.parse(JSON.stringify(pick(QUEST_TABLE.polar)));
  const L=bear==='black'?BLACK_MAIN:QUEST_TABLE[bear];if(!L)return null;if(q.i<L.length)return JSON.parse(JSON.stringify(L[q.i]));
  if(bear==='black')return JSON.parse(JSON.stringify(pick(BLACK_REP)));return null}
function acceptQuest(bear,cur){const q=ST.q[bear];cur.s0=cur.req.map(r=>absReq(r)?0:reqVal(r));q.cur=cur;for(const [k,n] of cur.st||[])give(k,n);note('📜 クエスト「'+cur.name+'」を受けた');save()}
function giveRewards(rw){for(const [k,n] of rw){if(k==='honey'){addHoney(n);note('🍯 +'+fmt(n))}else if(k==='science'){ST.sci++;note('🔬 サイエンスの強化：変換速度+25%（合計'+ST.sci+'）')}else if(k==='polar'){ST.polar++;note('❄️ ポーラーパワー：ハチのエネルギー×1.05')}else give(k,n)}calcStats()}
function finishQuest(bear){const q=ST.q[bear];giveRewards(q.cur.rw);q.done++;q.i++;q.cur=null;big('✅ クエスト完了！',1.6);SFX.levelup();save()}
const BEAR_TALK={black:['やあ、ビーキーパー！ぼくはブラックベア。花粉集めのことなら、まかせてよ。','いい集めっぷりだね！その調子でいこう。'],
 mother:['いらっしゃい。ハチたちと仲良くなるには、おやつをあげるのがいちばんよ。','ハチはきずなが深まるとレベルが上がるの。'],
 brown:['わしの頼みはいつも花粉集めだ。いくらやっても終わりはないぞ。','ふむ、どんどん頼むぞ。'],
 panda:['フィールドを荒らす虫たちをやっつけてくれないか。','ハチのレベルが敵より低いと、攻撃がはずれやすいぞ。'],
 science:['研究のために、いろいろなデータが必要なんだ。','ハチの種類をたくさん見つけてくれたまえ。'],
 polar:['料理の材料を集めてきてくれないか？ごほうびはポーラーパワーだ。','おいしいのができそうだ。']};
function talkBear(id){const B=BEARS[id];
  if(!BEAR_TALK[id]){showDlg(B.jp,id==='spirit'?'……風の声が聞こえる？（この版ではスピリットベアのクエストはまだ入っていません）':'ブーン！（この版ではハニービーのクエストはまだ入っていません）');return}
  const q=ST.q[id]||(ST.q[id]={i:0,cur:null,done:0});const T=BEAR_TALK[id];
  if(q.cur){const prog=q.cur.req.map((r,i)=>{const [v,n]=reqProg(r,q.cur.s0[i]);return `${v>=n?'✅':'⬜'} ${reqText(r)}　${fmt(Math.min(v,n))} / ${fmt(n)}`}).join('<br>');
    if(questDone(q.cur))showDlg(B.jp,'「'+q.cur.name+'」ができたね！ありがとう。<br>'+prog+'<br>ごほうび：'+rewText(q.cur.rw),[['ごほうびをもらう',()=>{finishQuest(id);hideDlg()},''],['とじる',hideDlg,'d']]);
    else showDlg(B.jp,'「'+q.cur.name+'」のとちゅうだね。<br>'+prog,[['とじる',hideDlg,'d']]);return}
  const nq=nextQuest(id);if(!nq){showDlg(B.jp,'もう頼みたいことはないよ。ありがとう！');return}
  showDlg(B.jp,(q.done?T[1]:T[0])+'<br><br><b>クエスト「'+nq.name+'」</b><br>'+nq.req.map(r=>'・'+reqText(r)+' '+fmt(r.n)).join('<br>')+'<br>ごほうび：'+rewText(nq.rw)+(nq.st&&nq.st.length?'<br>（受けるときに '+rewText(nq.st)+' がもらえる）':''),
    [['受ける',()=>{acceptQuest(id,nq);hideDlg()},''],['あとで',hideDlg,'d']])}

// ===================== 起動とメインループ =====================
let saveT=0,regT=0,dayT=0;
function boot(){load();calcStats();
  buildTerrain();for(const id of FIELD_IDS)buildField(id);buildHives();buildPlaces();buildRooms();
  BEARS.polar.y=24;syncBees();refreshLook();gatesUpdate();renderer.shadowMap.enabled=SET.shadow;
  teleport(HIVE_X(MY_HIVE),-1,0);
  $('bootBar').style.width='100%';$('bootTx').textContent='準備ができました';$('bootGo').style.visibility='visible';
  $('bootGo').onclick=start;G.state='ready'}
function start(){ac();$('boot').style.display='none';G.state='play';
  if(!ST.tut){ST.tut=1;big('🐝 ようこそ！',2.2);setTimeout(()=>note('🎒 持ち物の「ベーシックエッグ」をハイブで使って、最初のハチをかえそう（🐝ボタン）'),800);setTimeout(()=>note('🌻 ハチがいたら、ヒマワリ畑で左クリック長押し（スマホは🥄ボタン）で花粉を集めよう'),3500);setTimeout(()=>note('🐻 ブラックベア（ハイブの右）に話しかけるとクエストがもらえる'),6500);save()}}
// 昼と夜（本家のように時間がたつと夜になる）
function dayNight(dt){dayT+=dt;const cyc=900,ph=(dayT%cyc)/cyc,night=ph>.78?Math.min(1,(ph-.78)/.04)*(ph>.96?(1-ph)/.04:1):0;G.night=night;
  sun.intensity=lerp(.85,.15,night);hemi.intensity=lerp(.75,.35,night);sky.material.color.setRGB(lerp(1,.25,night),lerp(1,.3,night),lerp(1,.55,night));scene.fog.color.setRGB(lerp(.66,.12,night),lerp(.85,.15,night),lerp(.97,.3,night))}
function step(dt){G.t+=dt;G.dt=dt;updTimers();
  if(!updFlying(dt))updPlayer(dt);updBees(dt);updMobs(dt);updTokens(dt);updBubbles(dt);updFlames(dt);updMarks(dt);updObjs(dt);
  regT+=dt;if(regT>.5){regrowFlowers(regT);regT=0}flushFlowers();updFx(dt);dayNight(dt);
  saveT+=dt;if(saveT>15){saveT=0;save()}}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
  if(G.state==='play'){step(dt);updPrompt();updHud(dt)}
  if(!window.__camOverride)updCam(dt);renderer.render(scene,cam)}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')save()});
