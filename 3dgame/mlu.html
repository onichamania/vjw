<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Little Universe</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--ink:#2a1a3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1236;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:#fff;touch-action:none}
#game{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol{text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),1.5px 1.5px 0 var(--ink),-1.5px 1.5px 0 var(--ink),1.5px -1.5px 0 var(--ink),-1.5px -1.5px 0 var(--ink)}
.ic{width:22px;height:22px;vertical-align:middle;object-fit:contain;filter:drop-shadow(0 1px 0 rgba(0,0,0,.35))}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#tags>div{position:absolute;left:0;top:0;will-change:transform}
/* 左：資源 */
#res{position:absolute;left:calc(var(--sal) + 8px);top:calc(var(--sat) + 64px);display:flex;flex-direction:column;gap:4px;pointer-events:none;max-height:calc(100% - 140px);flex-wrap:wrap}
.rrow{display:flex;align-items:center;gap:5px;background:rgba(20,16,50,.55);border:2px solid rgba(255,255,255,.18);border-radius:14px;padding:2px 10px 2px 4px;font-weight:800;font-size:16px;min-width:74px}
.rrow .ic{width:26px;height:26px}
.rrow span{text-shadow:0 2px 0 rgba(0,0,0,.5)}
.rrow.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
/* 上 */
#topbar{position:absolute;top:calc(var(--sat) + 8px);left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:none}
.pill{white-space:nowrap;background:rgba(20,16,50,.6);border:2px solid rgba(255,255,255,.2);border-radius:16px;padding:4px 10px;display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px}
.bar{position:relative;width:86px;height:12px;border-radius:7px;background:rgba(0,0,0,.45);overflow:hidden;border:1.5px solid rgba(255,255,255,.35)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(#9ef56a,#3fbf2a)}
#hpBar{background:linear-gradient(#ff8a8a,#e02a3a)!important}
#tools{display:flex;gap:6px}
@media (max-width:600px){#topbar{flex-wrap:wrap;justify-content:center;width:calc(100vw - 120px);gap:4px}.pill{font-size:12px;padding:3px 7px;gap:4px}.bar{width:52px;height:10px}#hpTxt{display:none}#res{top:calc(var(--sat) + 84px)}.rrow{font-size:14px;min-width:62px;padding:1px 8px 1px 3px}.rrow .ic{width:22px;height:22px}}#tools span{display:flex;align-items:center;gap:1px;font-size:13px}#tools .ic{width:20px;height:20px}
/* 右上のボタン（歯車の下）*/
#btns{position:absolute;right:calc(var(--sar) + 10px);top:calc(var(--sat) + 62px);display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.5);background:linear-gradient(#5a6aff,#3a3ad0);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #1e1e80;cursor:pointer;padding:0}
.rb.act{background:linear-gradient(#ffcf3a,#f09a1a);box-shadow:0 3px 0 #a05a00}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 #1e1e80}
#netbox{position:absolute;right:calc(var(--sar) + 64px);top:calc(var(--sat) + 66px);font-size:12px;font-weight:800;background:rgba(20,16,50,.6);padding:3px 8px;border-radius:10px;display:none;pointer-events:none}
/* スティック */
#stick{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.4);display:none;pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(0,0,0,.3)}
/* 値札・建物の名前 */
.ptag{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:220px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:12px;padding:3px 8px;font-weight:800;font-size:15px;box-shadow:0 3px 0 rgba(30,20,80,.35);transform-origin:50% 100%}
.ptag span{display:flex;align-items:center;gap:2px;color:#d0303a}.ptag span.ok{color:#1a9a2a}.ptag .ic{width:22px;height:22px}
.ptag i{font-style:normal;font-size:11px;color:#7a5a20;width:100%;text-align:center}
.ptag.here{background:#fff6c0;box-shadow:0 0 0 3px #ffd21f,0 3px 0 rgba(30,20,80,.35)}
.btag{background:rgba(20,16,50,.72);border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:4px 9px;font-size:12px;text-align:center;white-space:nowrap;font-weight:800}
.btag b{display:block;font-size:13px;color:#ffe680}.btag div{display:flex;align-items:center;justify-content:center;gap:3px}.btag .sm{font-size:11px;color:#c8d0ff;font-weight:500}.btag .ic{width:20px;height:20px}
.lock{display:flex;align-items:center;gap:2px;background:rgba(40,10,20,.75);border:2px solid #ff7a8a;border-radius:10px;padding:2px 7px;font-weight:800;font-size:13px}.lock .ic{width:20px;height:20px}
.ebar,#meBar{width:56px;height:8px;border-radius:5px;background:rgba(0,0,0,.55);border:1.5px solid rgba(255,255,255,.6);overflow:hidden}
.ebar i,#meBar i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e02a3a)}.ebar.boss{width:110px;height:11px}
#meBar i{background:linear-gradient(#9ef56a,#3fbf2a)}
#meBar,#swimT,#dwBar{display:none}
#dwBar{width:64px;height:12px;border-radius:7px;background:rgba(20,16,50,.7);border:2px solid #fff;overflow:hidden;box-shadow:0 2px 0 rgba(0,0,0,.3)}#dwBar i{display:block;height:100%;width:0;background:linear-gradient(#fff3a0,#ffc21a)}
#swimT{font-weight:800;font-size:16px;background:rgba(0,40,90,.7);border-radius:10px;padding:2px 8px}
.flt{font-weight:800;font-size:20px;text-shadow:0 2px 0 #2a1a3a,1px 0 0 #2a1a3a,-1px 0 0 #2a1a3a}
.nameTag{font-weight:800;font-size:13px;transform:translate(-50%,-100%);background:rgba(20,16,50,.6);padding:1px 7px;border-radius:8px;white-space:nowrap}
/* 下：台の説明 */
#padui{position:absolute;left:50%;bottom:calc(var(--sab) + 18px);transform:translate(-50%,40px);opacity:0;transition:transform .2s,opacity .2s;background:rgba(255,255,255,.95);color:var(--ink);border-radius:18px;padding:10px 16px;min-width:240px;max-width:min(92vw,460px);text-align:center;box-shadow:0 4px 0 rgba(30,20,80,.4);pointer-events:none;font-weight:800;font-size:14px}
#padui.on{transform:translate(-50%,0);opacity:1}
#padui b{display:block;font-size:15px;margin-bottom:3px;color:#5a2aa0}#padui div{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
#padui .sm{font-size:12px;color:#6a6080;font-weight:500;margin-top:3px}#padui .cost span{display:flex;align-items:center;gap:2px;margin:0 3px;font-size:16px}#padui .cost .ok{color:#1a9a2a}#padui .cost .lack{color:#d0303a}
/* お知らせ */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 52px);transform:translate(-50%,-10px);opacity:0;transition:.25s;background:rgba(20,16,50,.85);border-radius:14px;padding:7px 14px;font-weight:800;font-size:14px;pointer-events:none;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:50%;top:28%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;text-align:center;transition:none}
#banner.on{animation:ban 2.8s forwards}
#banner b{display:block;font-size:40px;color:#ffe25a;text-shadow:0 4px 0 #5a2aa0,3px 0 0 #5a2aa0,-3px 0 0 #5a2aa0,0 -3px 0 #5a2aa0,2px 2px 0 #5a2aa0,-2px 2px 0 #5a2aa0}
#banner small{display:block;font-size:16px;font-weight:800;margin-top:4px;text-shadow:0 2px 0 #2a1a3a}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}10%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}16%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
#hurt{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 90px rgba(255,0,40,.0)}
#hurt.on{animation:hurt .45s}
@keyframes hurt{0%{box-shadow:inset 0 0 90px rgba(255,0,40,.7)}100%{box-shadow:inset 0 0 90px rgba(255,0,40,0)}}
#mapInfo{position:absolute;left:50%;bottom:calc(var(--sab) + 22px);transform:translateX(-50%);text-align:center;display:none;pointer-events:none}
#mapInfo b{display:block;font-size:30px;color:#ffe25a}#mapInfo span{font-weight:800}#mapInfo small{display:block;font-size:12px;opacity:.8;margin-top:4px}
body.mapv #res,body.mapv #topbar,body.mapv #padui{opacity:0}
body:not(.playing) #btns,body:not(.playing) #res,body:not(.playing) #topbar,body:not(.playing) #padui,body:not(.playing) #netbox{display:none!important}
/* 画面（メニューなど）*/
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:20;padding:calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px)}
.scr.on{display:flex}
.panel{background:rgba(8,6,30,.55)}
.box{background:linear-gradient(#fdfbff,#e8e2ff);color:var(--ink);border-radius:22px;padding:16px;width:min(92vw,420px);max-height:100%;overflow:auto;box-shadow:0 6px 0 rgba(30,20,80,.5);text-align:center}
.box h2{margin:2px 0 10px;font-size:22px;color:#5a2aa0}
.btn{display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:14px;font:800 16px 'M PLUS Rounded 1c',system-ui,sans-serif;color:#fff;background:linear-gradient(#5a6aff,#3a3ad0);box-shadow:0 4px 0 #1e1e80;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e1e80}.btn:disabled{opacity:.5}
.btn.g{background:linear-gradient(#6ee05a,#2faa2a);box-shadow:0 4px 0 #1a6a1a}.btn.y{background:linear-gradient(#ffcf3a,#f09a1a);box-shadow:0 4px 0 #a05a00}.btn.gr{background:linear-gradient(#9aa0b8,#6a708a);box-shadow:0 4px 0 #3a3f55}
textarea{width:100%;height:96px;border-radius:12px;border:2px solid #b8a8ff;padding:8px;font:12px monospace;resize:none;-webkit-user-select:text;user-select:text}
.msg{font-size:13px;color:#5a4a7a;margin:6px 0}
#title{flex-direction:column;justify-content:space-between;background:none}
#title .logo{margin-top:4vh;text-align:center}
#title .logo b{display:block;font-size:min(13vw,62px);line-height:1;color:#ffe25a;text-shadow:0 5px 0 #5a2aa0,4px 0 0 #5a2aa0,-4px 0 0 #5a2aa0,0 -4px 0 #5a2aa0,3px 3px 0 #5a2aa0,-3px 3px 0 #5a2aa0,3px -3px 0 #5a2aa0,-3px -3px 0 #5a2aa0}
#title .logo small{display:block;font-weight:800;font-size:15px;margin-top:10px;text-shadow:0 2px 0 #2a1a3a}
#title .tb{width:min(86vw,340px);margin-bottom:2vh}
#loading{background:rgba(8,6,30,.85);flex-direction:column;font-weight:800}
.skins{display:flex;gap:8px;overflow-x:auto;padding:4px}
.skin{flex:0 0 120px;background:#fff;border-radius:14px;padding:6px;border:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:3px}
.skin.sel{border-color:#ffd21f}.skin canvas{width:96px;height:110px}.skin b{font-size:13px}.skin small{font-size:10px;color:#6a6080;min-height:26px}.skin em{font-style:normal;font-size:12px;color:#1a9a2a;font-weight:800}
.skin button{border:0;border-radius:10px;padding:6px 8px;font:800 12px 'M PLUS Rounded 1c',sans-serif;background:#5a6aff;color:#fff}.skin button:disabled{opacity:.45}
.cost{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}.cst{display:flex;align-items:center;font-size:12px;font-weight:800}.cst.lack{color:#d0303a}
.room{background:#fff;border-radius:12px;padding:10px;margin:6px 0;cursor:pointer;text-align:left;border:2px solid #d8d0ff}.room b{display:block}.room small{color:#6a6080}.empty{color:#8a80a0;padding:12px}
#nRooms{max-height:40vh;overflow:auto}
/* 放置モード */
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px;max-height:42vh;overflow:auto;padding:2px}
.ai{position:relative;background:#fff;border:3px solid #d8d0ff;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-weight:800;font-size:12px;line-height:1.2}
.ai .ic{width:34px;height:34px}.ai small{font-size:10px;color:#8a80a0;font-weight:500}.ai.on{border-color:#2faa2a;background:#eaffe4}.ai.on::after{content:'✓';position:absolute;right:6px;top:2px;color:#2faa2a;font-size:16px}
.ai.en{background:#fff4f4}.ai.en.on{background:#ffe8e0;border-color:#e0603a}.ai.en.on::after{color:#e0603a}
.row2{display:flex;gap:8px}.row2 .btn{padding:8px;font-size:13px}
#autoBar{position:absolute;left:50%;bottom:calc(var(--sab) + 12px);transform:translateX(-50%);display:none;align-items:center;gap:6px;background:rgba(20,16,50,.78);border:2px solid #7ae0ff;border-radius:16px;padding:6px 8px 6px 12px;max-width:min(94vw,520px);font-size:13px}
body.auto #autoBar{display:flex}body.auto #padui{bottom:calc(var(--sab) + 78px)}
#autoBar .at{display:flex;flex-direction:column;min-width:0}#autoBar b{color:#7ae0ff;font-size:13px}#autoBar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}#autoBar small{font-size:11px;color:#c8d0ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
#autoBar button{border:0;border-radius:10px;padding:7px 10px;font:800 13px 'M PLUS Rounded 1c',sans-serif;color:#fff;background:#5a6aff;flex:none}#autoOff{background:#e0503a!important}
body.mapv #autoBar{opacity:.4}
</style>
</head>
<body>
<div id="game">
<canvas id="c"></canvas>
<div id="tags"><div id="meBar"><i></i></div><div id="swimT"></div><div id="dwBar"><i></i></div></div>
<div id="stick"><div id="knob"></div></div>
<div id="res" class="ui"></div>
<div id="topbar" class="ui"><div class="pill">🌍 ガイア <div class="bar"><i id="pBar"></i></div><span id="pPct">0%</span></div><div class="pill">❤️ <div class="bar"><i id="hpBar"></i></div><span id="hpTxt" style="font-size:12px"></span></div><div class="pill" id="tools"></div></div>
<div id="btns" class="ui"><button class="rb" id="bMenu" title="メニュー">☰</button><button class="rb" id="bMap" title="星の地図">🌍</button><button class="rb" id="bAuto" title="放置モード">🤖</button></div>
<div id="autoBar" class="ui"><div class="at"><b>🤖 放置中</b><span id="autoTxt"></span><small id="autoGot"></small></div><button id="autoSet" title="取るもの">⚙</button><button id="autoOff">やめる</button></div>
<div id="netbox"></div>
<div id="padui"></div>
<div id="mapInfo"></div>
<div id="toast"></div><div id="banner"></div><div id="hurt"></div>
</div>
<div id="title" class="scr"><div class="logo"><b>Little<br>Universe</b><small>小さな星をひらいていこう</small></div>
 <div class="tb"><button class="btn g" id="tCont">つづきから</button><button class="btn" id="tNew">はじめる</button><button class="btn y" id="tOnline">オンライン（いっしょに遊ぶ）</button><button class="btn gr" id="tCode">セーブコードで遊ぶ</button></div></div>
<div id="menu" class="scr panel"><div class="box"><h2>メニュー</h2>
 <button class="btn g" id="mClose">ゲームにもどる</button><button class="btn" id="mSkin">キャラクター</button><button class="btn y" id="mOnline">オンライン</button><button class="btn" id="mCode">セーブコード</button>
 <button class="btn gr" id="mYield">資源の量</button><button class="btn gr" id="mName">名前</button><button class="btn gr" id="mSound">音</button><button class="btn gr" id="mTitle">タイトルへ</button></div></div>
<div id="skins" class="scr panel"><div class="box"><h2>キャラクター</h2><div class="msg" id="skinNote"></div><div class="skins" id="skinList"></div><button class="btn gr" id="skinBack">もどる</button></div></div>
<div id="online" class="scr panel"><div class="box"><h2>オンライン</h2><div class="msg" id="nState"></div><div id="nRooms"></div><button class="btn y" id="nHost">自分の星で部屋を開く</button><div class="msg">同じ星でいっしょにタイルを開けます。持ち物と道具はそれぞれのもの。部屋に入ると、ホストの星で遊びます（自分の星はそのまま残ります）。</div><button class="btn gr" id="nBack">もどる</button></div></div>
<div id="codeScr" class="scr panel"><div class="box"><h2>セーブコード</h2><textarea id="codeTa" spellcheck="false"></textarea><div class="msg" id="codeMsg"></div><button class="btn" id="codeCopy">コピー</button><button class="btn y" id="codeCloud">ずっと使えるコードを作る</button><button class="btn g" id="codeLoad">このコードを読みこむ</button><button class="btn gr" id="codeBack">もどる</button></div></div>
<div id="dlg" class="scr panel"><div class="box"><h2 id="dlgT"></h2><div class="msg" id="dlgM"></div><input id="dlgIn" maxlength="14" style="width:100%;font:800 16px 'M PLUS Rounded 1c',sans-serif;padding:10px;border-radius:12px;border:2px solid #b8a8ff;-webkit-user-select:text;user-select:text"><button class="btn g" id="dlgOk">OK</button><button class="btn gr" id="dlgNo">やめる</button></div></div>
<div id="autoScr" class="scr panel"><div class="box"><h2>放置モード</h2><div class="msg">えらんだものを、自動で歩いて切ったり掘ったりします。えらべるのは、いま見つけていて、いまの道具で取れるものだけです。スティックを動かすと少しのあいだ手で動かせます。</div>
 <div class="ag" id="autoList"></div><div class="row2"><button class="btn gr" id="autoAll">全部えらぶ</button><button class="btn gr" id="autoNone">全部はずす</button></div>
 <div class="msg" id="autoNote"></div><button class="btn g" id="autoGo">放置をはじめる</button><button class="btn gr" id="autoBack">もどる</button></div></div>
<div id="loading" class="scr"><div id="loadTxt">読みこみ中…</div></div>
<div id="ending" class="scr panel"><div class="box"><h2>ガイアをクリア！</h2><div class="msg">ポータルが動いて、光の向こうに次の星が見えた！<br>（次の星「トロルヘイム」はまだ準備中です）</div><div class="msg" id="endStat"></div><button class="btn g" id="endBack">ガイアにもどる</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
// ---- 01_util.js ----
// ================= 道具（数学・乱数・保存・音）=================
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const LSget=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}};
const LSset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// 数の表示（1.2K・3.4M）
function fmt(n){n=Math.floor(n);if(n<1000)return String(n);if(n<1e6)return(n/1000).toFixed(n<1e4?1:0).replace(/\.0$/,'')+'K';return(n/1e6).toFixed(n<1e7?1:0).replace(/\.0$/,'')+'M'}
// ---- 球の上のベクトル（THREE.Vector3 を使う）----
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);

// ================= 星（六角タイルの球）=================
// 正二十面体を n 分割した点を球にのせ、その双対（点のまわりの三角形の重心）を六角形（12こだけ五角形）のタイルにする
let RELAX=40;
function makeHexSphere(n){
  const t=(1+Math.sqrt(5))/2;
  const V0=[[-1,t,0],[1,t,0],[-1,-t,0],[1,-t,0],[0,-1,t],[0,1,t],[0,-1,-t],[0,1,-t],[t,0,-1],[t,0,1],[-t,0,-1],[-t,0,1]].map(v=>nrm3(v));
  const F0=[[0,11,5],[0,5,1],[0,1,7],[0,7,10],[0,10,11],[1,5,9],[5,11,4],[11,10,2],[10,7,6],[7,1,8],[3,9,4],[3,4,2],[3,2,6],[3,6,8],[3,8,9],[4,9,5],[2,4,11],[6,2,10],[8,6,7],[9,8,1]];
  const P=[],key=new Map(),tris=[];
  const vid=v=>{const k=Math.round(v[0]*1e5)+','+Math.round(v[1]*1e5)+','+Math.round(v[2]*1e5);let i=key.get(k);if(i===undefined){i=P.length;P.push(v);key.set(k,i)}return i};
  for(const [a,b,c] of F0){const A=V0[a],B=V0[b],C=V0[c],id=[];
    for(let i=0;i<=n;i++){id.push([]);for(let j=0;j<=n-i;j++){const k=n-i-j;id[i].push(vid(nrm3([(A[0]*k+B[0]*i+C[0]*j)/n,(A[1]*k+B[1]*i+C[1]*j)/n,(A[2]*k+B[2]*i+C[2]*j)/n])))}}
    for(let i=0;i<n;i++)for(let j=0;j<n-i;j++){tris.push([id[i][j],id[i+1][j],id[i][j+1]]);if(j<n-i-1)tris.push([id[i+1][j],id[i+1][j+1],id[i][j+1]])}}
  const inc=P.map(()=>[]),nb=P.map(()=>new Set());
  tris.forEach((tr,ti)=>{for(let k=0;k<3;k++){inc[tr[k]].push(ti);nb[tr[k]].add(tr[(k+1)%3]);nb[tr[k]].add(tr[(k+2)%3])}});
  // ならす（タイルの大きさをそろえる）：辺の長さが同じになるようにばねで引っぱる
  const L0=2*Math.asin(1/(2*Math.sin(2*Math.PI/5)))/n*1.02;
  for(let it=0;it<RELAX;it++){const D=P.map(()=>[0,0,0]);for(let i=0;i<P.length;i++)for(const j of nb[i]){if(j<i)continue;const a=P[i],b=P[j],d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],l=Math.hypot(d[0],d[1],d[2]),f=(l-L0)/l*.25;for(let k=0;k<3;k++){D[i][k]+=d[k]*f;D[j][k]-=d[k]*f}}
    for(let i=0;i<P.length;i++)P[i]=nrm3([P[i][0]+D[i][0],P[i][1]+D[i][1],P[i][2]+D[i][2]])}
  const cen=tris.map(tr=>nrm3([P[tr[0]][0]+P[tr[1]][0]+P[tr[2]][0],P[tr[0]][1]+P[tr[1]][1]+P[tr[2]][1],P[tr[0]][2]+P[tr[1]][2]+P[tr[2]][2]]));
  const cells=P.map((p,i)=>{const [e1,e2]=tangentBasis(p);
    const ang=v=>{const d=[v[0]-p[0],v[1]-p[1],v[2]-p[2]];return Math.atan2(dot3(d,e2),dot3(d,e1))};
    const cs=inc[i].map(ti=>cen[ti]).sort((a,b)=>ang(a)-ang(b));
    const ns=[...nb[i]].sort((a,b)=>ang(P[a])-ang(P[b]));
    return{i,c:p,corners:cs,nb:ns}});
  return cells}
function nrm3(v){const l=Math.hypot(v[0],v[1],v[2])||1;return[v[0]/l,v[1]/l,v[2]/l]}
function dot3(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]}
function cross3(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}
function tangentBasis(p){const up=Math.abs(p[1])<.9?[0,1,0]:[1,0,0];const e1=nrm3(cross3(up,p));const e2=cross3(p,e1);return[e1,e2]}

function rotate3(v,axis,a){const c=Math.cos(a),s=Math.sin(a),d=dot3(axis,v),x=cross3(axis,v);return[v[0]*c+x[0]*s+axis[0]*d*(1-c),v[1]*c+x[1]*s+axis[1]*d*(1-c),v[2]*c+x[2]*s+axis[2]*d*(1-c)]}

// ---- ずっと使えるコード（LUC-XXXX-XXXX）：セーブするたびに、同じコードの中身を最新に上書きする ----
// 中身はランチャー（Claude のアーティファクト）のデータ（db）に置く：lusave/<コード> に見出し、lusave/<コード>/<a|b>/<番号> にセーブコード。

const CLOUD={key:null,s:null};   // このセーブがつながっているコードと、最後に読んだ／書いた版
const CL={p:null,db:null,canW:null,chain:Promise.resolve(),queued:false,qp:null,last:-1e9,tm:0,said:false,bad:false,conf:false};
const clRun=fn=>{const q=CL.chain.then(fn);CL.chain=q.catch(()=>{});return q};   // 書くのはいつも1つずつ

async function clHead(key){const db=await clInit();if(!db)throw new Error(clNoDb);const hs=await db.doc('lusave/'+key).get();return hs.exists?hs.data():null}

function clMark(s){CLOUD.s=s;try{const o=loadSave();if(o&&o.cloud===CLOUD.key&&o.cloudS!==s){o.cloudS=s;LSset(SAVE_KEY,JSON.stringify(o))}}catch(e){}}
// 新しいコードを作って、いまのセーブをつなぐ

  for(const r of rs){const d=document.createElement('div');d.className='room';d.innerHTML=`<b>${esc(r.n)} の星</b><small>${r.p}% ・ ${r.np}/8人${r.mine?'（あなたの別のタブ）':''}</small>`;d.onclick=()=>{SFX.click();if(NET.on){toast('いまは別の部屋にいます');return}if(STATE!=='play'){startPlay(true)}netJoin(r)};L.appendChild(d)}
  uiNetBox()}
function uiNetBox(){const e=$('netbox');if(!NET.on){e.style.display='none';return}const os=NET.others();e.style.display='block';e.textContent='🌐 '+(NET.host?'ホスト':'ゲスト')+'・'+(os.length+1)+'人'}
$('nHost').onclick=async()=>{SFX.click();if(STATE!=='play'){const s=loadSave();if(s)applySave(s);startPlay(true)}await netHost();showScr('');};
$('nBack').onclick=()=>{SFX.click();showScr(STATE==='play'?'menu':'title')};
// ---- 地図 ----
function uiMap(){$('bMap').classList.toggle('act',CAM.map);$('mapInfo').style.display=CAM.map?'block':'none';if(CAM.map){const pct=Math.floor((W.open.size-1)/NTILE*100);$('mapInfo').innerHTML=`<b>ガイア</b><span>${pct}% ・ タイル ${W.open.size-1}/${NTILE}</span><small>ドラッグで回す・もう一度🌍でもどる</small>`}}
// ---- タイトル ----
function toTitle(){if(NET.on)netLeave();autoStop();STATE='title';document.body.classList.remove('playing');CAM.map=true;document.body.classList.add('mapv');showScr('title');const s=loadSave();$('tCont').style.display=s?'':'none';$('tNew').textContent=s?'はじめから':'はじめる'}
function startPlay(keepScr){STATE='play';MUSIC.on=true;document.body.classList.add('playing');CAM.map=false;document.body.classList.remove('mapv');CAM.ready=0;if(!keepScr)showScr('');uiMap();HUD_DIRTY=true;resKey='';topKey=''}
$('tCont').onclick=async()=>{SFX.click();ac();let s=loadSave();
  if(s&&s.cloud){let h=null;try{h=await Promise.race([clHead(s.cloud),new Promise(r=>setTimeout(()=>r(undefined),4000))])}catch(e){h=undefined}
    if(h&&h.s&&h.s!==s.cloudS){const yes=await ask('ずっと使えるコード','コード '+clShow(s.cloud)+' は、別の場所で新しくなっています（'+(h.p|0)+'%）。最新の中身を読みこみますか？',{ok:'最新を読みこむ'});
      if(yes){try{s=await clLoad(s.cloud);LSset(SAVE_KEY,JSON.stringify(s))}catch(e){toast('読みこめませんでした：'+clErr(e))}}else{CL.conf=true;toast('この端末のぶんで続けます（コードには上書きしません）')}}}
  const made=applySave(s);startPlay();if(made>0)setTimeout(()=>toast('いないあいだに精錬所が '+made+' こ作っていました'),400)};
$('tNew').onclick=async()=>{SFX.click();ac();const old=loadSave();if(old&&!(await ask('はじめから','いまのセーブを消して、はじめからにしますか？'+(old.cloud?'（ずっと使えるコード '+clShow(old.cloud)+' の中身はそのまま残ります。新しいゲームはそのコードには上書きしません）':'（消す前にメニューのセーブコードでとっておけます）'),{ok:'はじめからにする'})))return;applySave(null);LSset(SAVE_KEY,JSON.stringify(snapshot()));startPlay();setTimeout(()=>banner('ガイア','木に近づくと自動で切れるよ'),500)};
$('tOnline').onclick=()=>{SFX.click();ac();openOnline()};
$('tCode').onclick=()=>{SFX.click();codeMode='';$('codeCloud').style.display='none';codeBig(false);$('codeTa').value='';$('codeMsg').textContent='セーブコード（長いコードか、ずっと使えるコード LUC-…）をはりつけて「このコードを読みこむ」を押してね';showScr('codeScr')};
// ---- エンディング ----
function goPortal(){SFX.portal();W.clear=1;saveGame();const t=Math.round(W.play||0);$('endStat').innerHTML=`遊んだ時間 ${Math.floor(t/3600)}時間${Math.floor(t%3600/60)}分<br>開いたタイル ${W.open.size-1}/${NTILE}`;showScr('ending');STATE='ending';document.body.classList.remove('playing')}
$('endBack').onclick=()=>{SFX.click();const B=portalB();if(B)B.went=0;respawn();startPlay()};

// ---- 放置モードの画面 ----
function openAuto(){inputReset();const L=autoKinds();if(AUTO.first){AUTO.first=false;L.filter(x=>x.type==='node').forEach(x=>AUTO.sel.add(x.id));autoSaveSel()}
  const el=$('autoList');el.innerHTML='';
  for(const x of L){const d=document.createElement('div');d.className='ai'+(x.type==='enemy'?' en':'')+(AUTO.sel.has(x.id)?' on':'');
    const N=x.type==='node'?NODE[x.k]:null;d.innerHTML=x.type==='node'?`${iconImg(N.res)}<span>${N.n}</span><small>${RES[N.res].n}・${x.n}こ</small>`:`${iconImg('weap')}<span>${ENEMY[x.k].n}</span><small>たおす・${x.n}ひき</small>`;
    d.onclick=()=>{SFX.click();if(AUTO.sel.has(x.id))AUTO.sel.delete(x.id);else AUTO.sel.add(x.id);d.classList.toggle('on',AUTO.sel.has(x.id));autoSaveSel();autoNote(L)};el.appendChild(d)}
  if(!L.length)el.innerHTML='<div class="empty">まだ取れるものがありません</div>';autoNote(L);$('autoGo').textContent=AUTO.on?'この内容で続ける':'放置をはじめる';showScr('autoScr')}
function autoNote(L){const n=L.filter(x=>AUTO.sel.has(x.id)).length;$('autoNote').textContent=n?n+'つえらんでいます'+(L.some(x=>x.type==='enemy'&&AUTO.sel.has(x.id))?'（敵もたおしに行きます。体力が少なくなったら、はじめの島で休みます）':''):'取るものを1つ以上えらんでください'}
function autoSaveSel(){LSset('lu-auto',JSON.stringify([...AUTO.sel]))}
$('bAuto').onclick=()=>{SFX.click();openAuto()};
$('autoSet').onclick=()=>{SFX.click();openAuto()};
$('autoOff').onclick=()=>{SFX.click();autoStop()};
$('autoAll').onclick=()=>{SFX.click();autoKinds().forEach(x=>AUTO.sel.add(x.id));autoSaveSel();openAuto()};
$('autoNone').onclick=()=>{SFX.click();autoKinds().forEach(x=>AUTO.sel.delete(x.id));autoSaveSel();openAuto()};
$('autoGo').onclick=()=>{SFX.click();if(!autoKinds().some(x=>AUTO.sel.has(x.id))){toast('取るものをえらんでください');return}if(!AUTO.on&&!autoStart())return;AUTO.tgt=null;showScr('')};
$('autoBack').onclick=()=>{SFX.click();showScr('')};
function uiAuto(){$('bAuto').classList.toggle('act',AUTO.on)}
let autoKey='';function drawAutoBar(){if(!AUTO.on)return;const g=Object.keys(AUTO.got).filter(k=>AUTO.got[k]>0).map(k=>RES[k].n+'+'+fmt(AUTO.got[k])).join(' ');const k=AUTO.st+'|'+g;if(k===autoKey)return;autoKey=k;$('autoTxt').textContent=AUTO.st||'さがしています…';$('autoGot').textContent=g?'集めたもの：'+g:''}

// ---- 12_main.js ----
// ================= はじまり・毎コマ =================
let GAME_READY=false;
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.fov=w<h?55:42;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
function init(){resize();buildNodes();buildDeco();buildBuildings();makeEnemies();makeTolls();
  applySave(loadSave());GAME_READY=true;toTitle();requestAnimationFrame(frame);
  // 少しずつ自動セーブ
  setInterval(()=>{if(STATE==='play')saveGame()},20000);addEventListener('pagehide',saveGame)}
let last=performance.now(),ghostT=0;
function frame(t){requestAnimationFrame(frame);let dt=(t-last)/1000;last=t;if(!(dt>0))dt=1/60;const rdt=Math.min(dt,10);dt=Math.min(dt,.05);
  WAVE.value+=dt;ghostT+=dt;
  if(STATE==='play'){autoTick(dt);updatePlayer(dt);payTick(dt);updateBuildings(dt,rdt);dwellStep(dt);updateGuide(dt);W.play=(W.play||0)+rdt;if(saveT>0){saveT-=dt;if(saveT<=0){saveT=0;saveGame()}}}
  else{if(GUIDE)GUIDE.visible=false}
  if(STATE==='title'){CAM.mapQ.premultiply(_q1.setFromAxisAngle(_t1.set(0,1,0).applyQuaternion(CAM.mapQ),dt*.08));CAM.mapDist=lerp(CAM.mapDist,innerWidth<innerHeight?95:72,dt*2)}
  updateNodes(dt);if(STATE==='play')updateEnemies(dt);updatePieces(dt);updateSparks(dt);updateRising(dt);
  ghostMat.opacity=.22+Math.sin(ghostT*3)*.1;ghostLine.opacity=.7+Math.sin(ghostT*3)*.25;
  updateCamera(dt);drawPlayer(dt);NET.tick(dt);
  renderer.render(scene,camera);
  if(STATE==='play'){if(HUD_DIRTY){drawRes();HUD_DIRTY=false}drawTop();drawPriceTags();drawWorldTags();drawPadUI();drawAutoBar();updateFloats(dt)}
  else{for(const n in PTAGS)PTAGS[n].style.display='none'}}
init();
