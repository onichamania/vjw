/* ============================================================
   Online play over WebRTC (PeerJS). One player hosts the
   authoritative Sim; others send inputs and receive snapshots.
   Quick match finds lobbies by well-known peer ids.
   ============================================================ */
const Net = {
  async load() {
    if (window.Peer) return true;
    return new Promise(res => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js';
      s.onload = () => res(!!window.Peer); s.onerror = () => res(false);
      document.head.appendChild(s);
    });
  },
  opts() {
    const o = { debug: 0 };
    try {
      const ps = new URLSearchParams(location.search).get('peerserver');
      if (ps) { const [h, p] = ps.split(':'); Object.assign(o, { host: h, port: +p || 9000, path: '/', secure: false }); }
    } catch (e) { /* ignore */ }
    return o;
  },
  newPeer(id) {
    return new Promise(res => {
      let done = false, p;
      const fin = v => { if (done) return; done = true; clearTimeout(to); res(v); };
      try { p = id ? new Peer(id, this.opts()) : new Peer(this.opts()); } catch (e) { return res({ err: 'init' }); }
      const to = setTimeout(() => { fin({ err: 'timeout' }); try { p.destroy(); } catch (e) { /* */ } }, 12000);
      p.on('open', () => fin({ peer: p }));
      p.on('error', e => { if (!done) { fin({ err: (e && e.type) || 'error' }); try { p.destroy(); } catch (x) { /* */ } } });
    });
  },
  connect(peer, id) {
    return new Promise(res => {
      let done = false, conn;
      const onErr = e => { if (e && e.type === 'peer-unavailable' && String(e.message || '').includes(id)) fin({ err: 'none' }); };
      const fin = v => { if (done) return; done = true; clearTimeout(to); peer.off('error', onErr); res(v); };
      peer.on('error', onErr);
      try { conn = peer.connect(id, { reliable: true, serialization: 'json' }); } catch (e) { return fin({ err: 'conn' }); }
      if (!conn) return fin({ err: 'conn' });
      conn.on('open', () => fin({ conn }));
      conn.on('error', () => fin({ err: 'conn' }));
      const to = setTimeout(() => { fin({ err: 'timeout' }); try { conn.close(); } catch (e) { /* */ } }, 9000);
    });
  },
  roomCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += a[Math.floor(Math.random() * a.length)]; return s; },
};

function cleanLoadout(lo) {
  lo = lo || {};
  const bid = BR[lo.bid] ? lo.bid : 'haruto';
  const lvl = clamp(lo.lvl | 0, 1, 11);
  return { bid, lvl, g: lo.g === 0 || lo.g === 1 ? lo.g : null, sp: lo.sp === 0 || lo.sp === 1 ? lo.sp : null, hy: !!lo.hy, buf: { g: !!(lo.buf && lo.buf.g), s: !!(lo.buf && lo.buf.s), h: !!(lo.buf && lo.buf.h) }, tr: clamp(lo.tr | 0, 0, 99999) };
}
function cleanAct(a) {
  if (!a || !['a', 's', 'g', 'h'].includes(a.k)) return null;
  const o = { k: a.k };
  if (typeof a.ang === 'number' && isFinite(a.ang)) o.ang = a.ang;
  if (typeof a.d === 'number' && isFinite(a.d)) o.d = a.d;
  if (a.auto) o.auto = true;
  return o;
}

/* bots that fill empty slots */
function makeBots(n, avgLvl, avgTr, rnd, exclude) {
  const out = [], used = new Set(exclude || []);
  const names = shuffle(BOT_NAMES.slice(), rnd);
  for (let i = 0; i < n; i++) {
    let b = pick(BRAWLERS, rnd);
    for (let k = 0; k < 4 && used.has(b.id); k++) b = pick(BRAWLERS, rnd);
    used.add(b.id);
    const lvl = clamp(Math.round(avgLvl + (rnd() - 0.5) * 2), 1, 11);
    const skill = clamp(0.3 + avgTr / 1400 + (rnd() - 0.5) * 0.2, 0.25, 0.92);
    out.push({ name: names[i % names.length], bid: b.id, lvl, g: lvl >= 7 ? Math.floor(rnd() * 2) : null, sp: lvl >= 9 ? Math.floor(rnd() * 2) : null, hy: lvl >= 11, buf: {}, bot: true, skill });
  }
  return out;
}

/* Build the match player list from humans [{name, lo}] */
function buildRoster(mode, humans, coop, rnd) {
  const md = MODES[mode];
  const avgLvl = humans.reduce((s, h) => s + h.lo.lvl, 0) / humans.length;
  const avgTr = humans.reduce((s, h) => s + (h.lo.tr || 0), 0) / humans.length;
  const roster = [];
  if (md.teams) {
    const teams = [[], []];
    humans.forEach((h, i) => {
      let t = coop ? (teams[0].length < 3 ? 0 : 1) : (i % 2);
      if (teams[t].length >= 3) t = 1 - t;
      teams[t].push(h);
    });
    for (let t = 0; t < 2; t++) {
      for (const h of teams[t]) roster.push(Object.assign({ name: h.name, team: t, human: h }, h.lo));
      for (const b of makeBots(3 - teams[t].length, avgLvl, avgTr, rnd, roster.map(r => r.bid))) roster.push(Object.assign(b, { team: t }));
    }
  } else {
    humans.forEach(h => roster.push(Object.assign({ name: h.name, human: h }, h.lo)));
    for (const b of makeBots(md.size - humans.length, avgLvl, avgTr, rnd, roster.map(r => r.bid))) roster.push(b);
    roster.forEach((r, i) => r.team = i);
  }
  return roster;
}

class HostSession {
  constructor(peer, kind, mode, opts) {
    this.peer = peer; this.kind = kind; this.mode = mode; this.clients = []; this.state = 'lobby';
    this.coop = !!(opts && opts.coop); this.code = opts && opts.code; this.onChange = null; this.match = null;
    this.timer = kind === 'qm' ? 14 : null;
    peer.on('connection', c => this.onConn(c));
    peer.on('disconnected', () => { if (this.state !== 'closed') { try { peer.reconnect(); } catch (e) { /* */ } } });
  }
  get max() { return MODES[this.mode].size; }
  onConn(c) {
    c.on('data', d => this.onData(c, d));
    c.on('close', () => this.drop(c));
    c.on('error', () => this.drop(c));
  }
  onData(c, d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'hello') {
      if (this.state !== 'lobby' || this.clients.length + 1 >= this.max || d.v !== PROTO || (d.mode && d.mode !== this.mode && this.kind === 'qm')) {
        try { c.send({ t: 'full' }); } catch (e) { /* */ }
        setTimeout(() => { try { c.close(); } catch (e) { /* */ } }, 400);
        return;
      }
      if (this.clients.some(x => x.c === c)) return;
      this.clients.push({ c, name: String(d.name || 'Player').slice(0, 12), lo: cleanLoadout(d.lo), pid: -1 });
      if (this.kind === 'qm') this.timer = Math.max(this.timer, 5);
      this.sendLobby();
      if (this.onChange) this.onChange();
      if (this.kind === 'qm' && this.clients.length + 1 >= this.max) this.start();
    } else if (d.t === 'in') {
      const cl = this.clients.find(x => x.c === c);
      if (!cl || !this.match || cl.pid < 0) return;
      const p = this.match.sim.players[cl.pid];
      if (!p || p.bot) return;
      p.mx = clamp(+d.mx || 0, -1, 1); p.my = clamp(+d.my || 0, -1, 1);
      if (d.s > p.ack) p.ack = d.s | 0;
      if (Array.isArray(d.a)) for (const a of d.a.slice(0, 8)) { const ca = cleanAct(a); if (ca) p.acts.push(ca); }
    } else if (d.t === 'leave') this.drop(c);
  }
  lobby() {
    return {
      t: 'lobby', mode: this.mode, kind: this.kind, code: this.code, coop: this.coop, timer: this.timer == null ? null : Math.ceil(this.timer),
      players: [{ name: Profile.d.name, bid: Profile.loadout().bid, host: true }].concat(this.clients.map(c => ({ name: c.name, bid: c.lo.bid }))),
      max: this.max,
    };
  }
  sendLobby() { const L = this.lobby(); this.broadcast(L); }
  setMode(m) { if (this.state !== 'lobby') return; this.mode = m; if (this.clients.length + 1 > this.max) { /* survival 8 > 6 fine */ } this.sendLobby(); if (this.onChange) this.onChange(); }
  setCoop(v) { this.coop = v; this.sendLobby(); if (this.onChange) this.onChange(); }
  tick(dt) {
    if (this.state === 'lobby' && this.timer != null) {
      const before = Math.ceil(this.timer);
      this.timer -= dt;
      if (Math.ceil(this.timer) !== before) { this.sendLobby(); if (this.onChange) this.onChange(); }
      if (this.timer <= 0) this.start();
    }
  }
  drop(c) {
    const i = this.clients.findIndex(x => x.c === c);
    if (i < 0) return;
    const cl = this.clients[i];
    this.clients.splice(i, 1);
    try { c.close(); } catch (e) { /* */ }
    if (this.match && cl.pid >= 0) {
      const p = this.match.sim.players[cl.pid];
      if (p && !p.bot) { p.bot = true; p.skill = 0.5; p.mx = p.my = 0; this.match.bots.push(new Bot(p)); }
      if (this.match.sim.phase !== 'end') Game.toast(cl.name + ' が切断しました（ボットが代わりに戦います）');
    }
    if (this.state === 'lobby') { this.sendLobby(); if (this.onChange) this.onChange(); }
  }
  start() {
    if (this.state !== 'lobby') return;
    this.state = 'play';
    const rnd = mulberry32((Math.random() * 1e9) | 0);
    const humans = [{ name: Profile.d.name, lo: Profile.loadout(), host: true }].concat(this.clients.map(c => ({ name: c.name, lo: c.lo, cl: c })));
    const roster = buildRoster(this.mode, humans, this.coop, rnd);
    const md = MODES[this.mode];
    const sim = new Sim({ mode: this.mode, mapId: pick(md.maps, rnd), players: roster, seed: (rnd() * 1e9) | 0 });
    let hostPid = 0;
    roster.forEach((r, i) => {
      if (r.human && r.human.cl) r.human.cl.pid = i;
      if (r.human && r.human.host) hostPid = i;
    });
    const init = sim.initInfo();
    for (const cl of this.clients) { try { cl.c.send({ t: 'start', init, you: cl.pid }); } catch (e) { /* */ } }
    if (this.onChange) this.onChange = null;
    Game.startMatch({ kind: 'host', sim, me: hostPid, session: this });
  }
  broadcast(msg) { for (const cl of this.clients) if (cl.c.open) { try { cl.c.send(msg); } catch (e) { /* */ } } }
  close() {
    if (this.state === 'closed') return;
    this.state = 'closed';
    this.broadcast({ t: 'bye' });
    const p = this.peer;
    setTimeout(() => { try { p.destroy(); } catch (e) { /* */ } }, 600);
  }
}

class ClientSession {
  constructor(peer, conn) {
    this.peer = peer; this.conn = conn; this.state = 'join'; this.lobbyInfo = null; this.onLobby = null; this.match = null; this.waiters = [];
    conn.on('data', d => this.onData(d));
    conn.on('close', () => this.onClose());
    conn.on('error', () => this.onClose());
  }
  hello(mode) { this.send({ t: 'hello', v: PROTO, name: Profile.d.name, lo: Profile.loadout(), mode }); }
  waitLobby(ms) {
    return new Promise(res => {
      const to = setTimeout(() => res(false), ms);
      this.waiters.push(ok => { clearTimeout(to); res(ok); });
    });
  }
  onData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.t === 'lobby') {
      this.lobbyInfo = d;
      if (this.state === 'join') { this.state = 'lobby'; this.waiters.splice(0).forEach(f => f(true)); }
      if (this.onLobby) this.onLobby(d);
    } else if (d.t === 'full') { this.waiters.splice(0).forEach(f => f(false)); }
    else if (d.t === 'start') {
      this.state = 'play';
      Game.startMatch({ kind: 'client', init: d.init, me: d.you, session: this });
    } else if (d.t === 's') { if (this.match) this.match.onSnap(d); }
    else if (d.t === 'end') { if (this.match) this.match.onEnd(d); }
    else if (d.t === 'bye') this.onClose();
  }
  send(m) { if (this.conn && this.conn.open) { try { this.conn.send(m); } catch (e) { /* */ } } }
  onClose() {
    if (this.state === 'closed') return;
    const was = this.state;
    this.state = 'closed';
    this.waiters.splice(0).forEach(f => f(false));
    if (was === 'play' && this.match && !this.match.ended) this.match.onDisconnect();
    else if (was === 'lobby') { UI.closeOnline(); Game.toast('ホストとの接続が切れました'); }
    try { this.peer.destroy(); } catch (e) { /* */ }
  }
  close() {
    if (this.state !== 'closed') this.send({ t: 'leave' });
    this.state = 'closed';
    const p = this.peer, c = this.conn;
    setTimeout(() => { try { c.close(); } catch (e) { /* */ } try { p.destroy(); } catch (e) { /* */ } }, 300);
  }
}

/* --- quick match: join an open lobby or become its host --- */
const Online = {
  busy: false, cancelled: false, cur: null,
  cancel() {
    this.cancelled = true;
    if (this.cur) { try { this.cur.close(); } catch (e) { /* */ } }
    this.cur = null; this.busy = false;
  },
  async quick(mode, status) {
    this.busy = true; this.cancelled = false;
    status('オンライン機能を読み込み中…');
    if (!await Net.load()) { this.busy = false; return { err: 'オンライン機能を読み込めませんでした。通信環境を確認してください。' }; }
    if (this.cancelled) return { cancelled: true };
    status('対戦相手を探しています…');
    let me = null, retries = 0;
    const drop = () => { if (me) { try { me.peer.destroy(); } catch (e) { /* */ } } me = null; };
    for (let n = 1; n <= 6; n++) {
      if (this.cancelled) { drop(); return { cancelled: true }; }
      const id = PEER_PREFIX + 'qm-' + mode + '-' + n;
      // Try to open lobby n ourselves. If the id is taken, a lobby exists: join it.
      const h = await Net.newPeer(id);
      if (this.cancelled) { if (h.peer) h.peer.destroy(); drop(); return { cancelled: true }; }
      if (h.peer) {
        drop();
        const hs = new HostSession(h.peer, 'qm', mode, {});
        this.cur = hs; this.busy = false;
        return { host: hs };
      }
      if (h.err !== 'unavailable-id') { drop(); this.busy = false; return { err: 'マッチングサーバーに接続できませんでした（' + h.err + '）。' }; }
      if (!me) {
        me = await Net.newPeer();
        if (me.err) { this.busy = false; return { err: 'マッチングサーバーに接続できませんでした（' + me.err + '）。' }; }
      }
      const r = await Net.connect(me.peer, id);
      if (this.cancelled) { drop(); return { cancelled: true }; }
      if (r.conn) {
        const cs = new ClientSession(me.peer, r.conn);
        this.cur = cs;
        cs.hello(mode);
        const ok = await cs.waitLobby(5000);
        if (ok) { this.busy = false; return { client: cs }; }
        this.cur = null; cs.state = 'closed';
        try { r.conn.close(); } catch (e) { /* */ }
        continue;
      }
      // the lobby host vanished between our two calls: try the same slot again
      if (r.err === 'none' && retries++ < 3) n--;
    }
    drop();
    this.busy = false;
    return { err: '空いているロビーが見つかりませんでした。' };
  },
  async createRoom(mode, status) {
    this.busy = true; this.cancelled = false;
    status('オンライン機能を読み込み中…');
    if (!await Net.load()) { this.busy = false; return { err: 'オンライン機能を読み込めませんでした。' }; }
    for (let i = 0; i < 4; i++) {
      const code = Net.roomCode();
      status('ルームを作成中…');
      const h = await Net.newPeer(PEER_PREFIX + 'room-' + code);
      if (this.cancelled) { if (h.peer) h.peer.destroy(); return { cancelled: true }; }
      if (h.peer) { const hs = new HostSession(h.peer, 'room', mode, { code, coop: true }); this.cur = hs; this.busy = false; return { host: hs }; }
      if (h.err !== 'unavailable-id') { this.busy = false; return { err: 'ルームを作成できませんでした（' + h.err + '）。' }; }
    }
    this.busy = false;
    return { err: 'ルームを作成できませんでした。' };
  },
  async joinRoom(code, status) {
    this.busy = true; this.cancelled = false;
    code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 4) { this.busy = false; return { err: 'ルームコードは4文字です。' }; }
    status('オンライン機能を読み込み中…');
    if (!await Net.load()) { this.busy = false; return { err: 'オンライン機能を読み込めませんでした。' }; }
    status('ルームを探しています…');
    const me = await Net.newPeer();
    if (me.err) { this.busy = false; return { err: 'サーバーに接続できませんでした（' + me.err + '）。' }; }
    const r = await Net.connect(me.peer, PEER_PREFIX + 'room-' + code);
    if (this.cancelled) { me.peer.destroy(); return { cancelled: true }; }
    if (!r.conn) { me.peer.destroy(); this.busy = false; return { err: r.err === 'none' ? 'ルーム「' + code + '」が見つかりません。' : 'ルームに接続できませんでした。' }; }
    const cs = new ClientSession(me.peer, r.conn);
    this.cur = cs;
    cs.hello();
    const ok = await cs.waitLobby(6000);
    this.busy = false;
    if (!ok) { cs.close(); this.cur = null; return { err: 'ルームが満員か、試合中です。' }; }
    return { client: cs };
  },
};

const strHash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };

const Profile = {
  KEY: 'rumbleArena.v1', d: null,
  fresh() {

  unlock(id) { if (!this.d.br[id]) this.d.br[id] = { lv: 1, tr: 0, best: 0, g: [0, 0], s: [0, 0], hy: 0, eg: 0, es: 0, buf: { g: 0, s: 0, h: 0 } }; },
  owned(id) { return !!this.d.br[id]; },

    const eqS = b.s[b.es] ? b.es : b.s[1 - b.es] ? 1 - b.es : null;
    return { bid, lvl: b.lv, g: eqG, sp: eqS, hy: !!b.hy, buf: { g: !!b.buf.g, s: !!b.buf.s, h: !!b.buf.h }, tr: b.tr || 0 };
  },
  canAfford(cost) { return (cost.coins || 0) <= this.d.coins && (cost.pp || 0) <= this.d.pp && (cost.gems || 0) <= this.d.gems; },
  pay(cost) { if (!this.canAfford(cost)) return false; this.d.coins -= cost.coins || 0; this.d.pp -= cost.pp || 0; this.d.gems -= cost.gems || 0; return true; },
};

/* lucky boxes */
function rollBox(minR) {
  const tot = BOX_RAR.reduce((s, r) => s + r.w, 0);
  let x = Math.random() * tot, idx = 0;
  for (let i = 0; i < BOX_RAR.length; i++) { x -= BOX_RAR[i].w; if (x <= 0) { idx = i; break; } }
  idx = Math.max(idx, minR || 0);
  return idx;
}
function boxContents(idx) {
  const R_ = (a, b) => Math.round(a + Math.random() * (b - a));
  const locked = BRAWLERS.filter(b => !Profile.owned(b.id));
  const rarOrder = ['starter', 'rare', 'super', 'epic', 'mythic', 'legend'];
  const lockedUpTo = maxR => locked.filter(b => rarOrder.indexOf(b.rarity) <= maxR);
  const x = Math.random();
  switch (idx) {
    case 0: return x < 0.5 ? { coins: R_(40, 80) } : { pp: R_(25, 50) };
    case 1: return x < 0.4 ? { coins: R_(100, 160) } : x < 0.8 ? { pp: R_(70, 110) } : { gems: R_(3, 5) };
    case 2: {
      const lb = lockedUpTo(3);
      if (x < 0.12 && lb.length) return { brawler: pick(lb).id };
      return x < 0.45 ? { coins: R_(250, 350) } : x < 0.8 ? { pp: R_(180, 240) } : { gems: 10 };
    }
    case 3: {
      const lb = lockedUpTo(4);
      if (x < 0.5 && lb.length) return { brawler: pick(lb).id };
      return x < 0.75 ? { coins: R_(550, 700) } : { pp: R_(380, 450) };
    }
    default: {
      if (locked.length) return { brawler: pick(locked).id };
      return { coins: 1500, gems: 40 };
    }
  }
}
function grant(r) {
  const d = Profile.d;
  if (r.coins) d.coins += r.coins;
  if (r.pp) d.pp += r.pp;
  if (r.gems) d.gems += r.gems;
  if (r.brawler) Profile.unlock(r.brawler);

}

  const s = Math.min(w, h) * (opts.scale || 0.62);
  drawBrawler(c, bid, w / 2, h * 0.8 - s * 0.32, s, opts.ang == null ? 0.35 : opts.ang, { t, moving: false });
}

    const d = Profile.d;

        const st = d.br[ds.id]; if (!st || st.lv >= 11) break;
        const c = LV_COST[st.lv + 1];
        if (Profile.pay({ coins: c.c, pp: c.pp })) { st.lv++; Profile.save(); Snd.play('upgrade'); Game.toast(BR[ds.id].name + ' がパワーレベル ' + st.lv + ' になった！'); this.refresh(); }
        break;
      }
      case 'buy': {
        const st = d.br[ds.id]; if (!st) break;
        const k = ds.k, i = +ds.i;
        const cost = k === 'g' ? COST.gadget : k === 's' ? COST.sp : COST.hyper;
        const req = k === 'g' ? REQ.gadget : k === 's' ? REQ.sp : REQ.hyper;
        if (st.lv < req) { Game.toast('パワーレベル ' + req + ' が必要です'); break; }
        if (!Profile.pay({ coins: cost })) break;
        if (k === 'g') { st.g[i] = 1; st.eg = i; } else if (k === 's') { st.s[i] = 1; st.es = i; } else st.hy = 1;
        Profile.save(); Snd.play('upgrade'); this.refresh();
        break;
      }
      case 'equip': { const st = d.br[ds.id]; if (!st) break; if (ds.k === 'g') st.eg = +ds.i; else st.es = +ds.i; Profile.save(); this.refresh(); break; }
      case 'buffy': {
        const st = d.br[ds.id]; if (!st) break;
        const k = ds.k;
        const base = k === 'g' ? st.g[0] || st.g[1] : k === 's' ? st.s[0] || st.s[1] : st.hy;
        if (!base || st.buf[k]) break;
        if (!Profile.pay({ coins: COST.buffy })) break;
        st.buf[k] = 1; Profile.save(); Snd.play('upgrade'); Game.toast(BUFFY[k].name + ' を手に入れた！'); this.refresh();
        break;
      }
      case 'gift': {
        if (d.daily.gift) break;
        d.daily.gift = true;
        const x = Math.random();
        const r = x < 0.4 ? { coins: 40 + Math.floor(Math.random() * 40) } : x < 0.8 ? { pp: 30 + Math.floor(Math.random() * 30) } : { gems: 3 + Math.floor(Math.random() * 4) };
        grant(r); Snd.play('coin');
        this.rewardModal('デイリーギフト', r);
        break;
      }
      case 'deal': {
        const i = +ds.i, o = dailyDeals()[i];
        if (d.daily.deals[i] || !Profile.pay(o.cost)) break;
        d.daily.deals[i] = true; Profile.save();
        this.give(o.give);
        break;
      }
      case 'shopbuy': {
        const o = SHOP[+ds.i];
        if (!Profile.pay(o.cost)) break;
        Profile.save();
        this.give(o.give);
        break;
      }
      case 'claim': {
        const i = +ds.i, r = ROAD[i];
        if (d.road[i] || Profile.trophies() < r.t) break;
        d.road[i] = 1;
        if (r.r.brawler) {
          if (Profile.owned(r.r.brawler)) { grant({ coins: 300 }); this.rewardModal('トロフィーロード', { coins: 300 }); }
          else { grant({ brawler: r.r.brawler }); this.unlockModal(r.r.brawler); }
        } else if (r.r.box) { Profile.save(); this.openBoxes([BOX_RAR.findIndex(x => x.id === r.r.box)]); }
        else { grant(r.r); Snd.play('coin'); this.rewardModal('トロフィーロード', r.r); }
        break;
      }
      case 'saveName': {
        const v = (document.getElementById('nameIn').value || '').trim().slice(0, 12);
        if (v) { d.name = v; Profile.save(); Game.toast('名前を保存しました'); this.refresh(); }
        break;
      }
      case 'sound': d.sound = !d.sound; Snd.on = d.sound; Profile.save(); this.refresh(); break;
      case 'reset': this.confirmModal('データをリセット', 'トロフィー・キャラ・通貨がすべて消えます。元に戻せません。', 'リセットする', () => { Profile.d = Profile.fresh(); Profile.unlock('haruto'); Profile.save(); this.show('home'); Game.toast('データをリセットしました'); }); break;
      case 'battle': Game.battle(); break;
      case 'closeModal': this.closeModal(); break;
      case 'modalOk': { const f = this.modalCb; this.closeModal(); if (f) f(); break; }
      case 'boxTap': this.boxTap(); break;
      case 'cancelOnline': this.closeOnline(true); break;
      case 'roomCreate': this.roomCreate(); break;
      case 'roomJoin': this.roomJoin(); break;
      case 'roomMode': if (this.online && this.online.host) this.online.host.setMode(ds.v); break;
      case 'roomCoop': if (this.online && this.online.host) this.online.host.setCoop(ds.v === '1'); break;
      case 'roomStart': if (this.online && this.online.host) this.online.host.start(); break;
      case 'copyCode': {
        const code = ds.code;
        try { navigator.clipboard.writeText(code).then(() => Game.toast('コピーしました'), () => Game.toast('コード: ' + code)); } catch (e) { Game.toast('コード: ' + code); }
        break;
      }
      case 'pause': Game.pauseMenu(); break;
      case 'leaveMatch': this.closeModal(); Game.leaveMatch(); break;
      case 'resultNext': this.resultNext(); break;
    }
  },

function matchRewards(res) {
  const d = Profile.d, b = d.br[res.bid];
  if (!b) return { dt: 0, coins: 0, pp: 0, boxes: 0 };
  const tr = b.tr;
  let dt = 0, coins = 10, pp = 8, boxes = 0, bonus = false;
  let win = false;
  if (res.mode === 'survival') {
    const tbl = [0, 10, 8, 6, 4, 1, -2, -4, -6];
    dt = tbl[res.rank] != null ? tbl[res.rank] : -6;
    if (dt < 0 && tr < 40) dt = 0;
    coins = [5, 30, 25, 20, 16, 12, 9, 7, 5][res.rank] || 5;
    pp = [4, 24, 20, 16, 13, 10, 8, 6, 4][res.rank] || 4;
    boxes = res.rank <= 3 ? 1 : 0;
    win = res.rank === 1;
  } else if (res.outcome === 'win') {
    dt = tr < 300 ? 8 : tr < 600 ? 7 : tr < 1000 ? 6 : 5; coins = 25; pp = 20; boxes = 1; win = true;
  } else if (res.outcome === 'draw') { dt = 0; coins = 15; pp = 12; }
  else { dt = tr < 40 ? 0 : tr < 300 ? -3 : tr < 600 ? -4 : -5; coins = 10; pp = 8; }
  if (res.left) { dt = Math.min(dt, tr < 40 ? 0 : -3); coins = 0; pp = 0; boxes = 0; win = false; }
  dt = Math.max(dt, -tr);
  if (win && !d.daily.fw) { Profile.daily(); d.daily.fw = true; coins += 30; bonus = true; }
  b.tr += dt; b.best = Math.max(b.best || 0, b.tr);
  d.coins += coins; d.pp += pp;
  d.stats.games++; if (win) d.stats.wins++; d.stats.kills += res.kills || 0;
  Profile.save();
  return { dt, coins, pp, boxes, bonus };
}

/* ============================================================
   Client world: rebuilds the match from host snapshots
   (interpolates others, predicts own movement)
   ============================================================ */
class ClientWorld {
  constructor(init, meId) {
    this.mode = init.mode; this.md = MODES[init.mode]; this.teams = this.md.teams;
    const m = buildMap(init.mapId);
    this.theme = m.theme; this.mine = m.mine; this.mapName = m.name;
    this.w = init.w; this.h = init.h; this.grid = Uint8Array.from(init.grid); this.boxHp = Object.assign({}, init.boxHp || {});
    this.players = init.players.map(pi => ({
      id: pi.id, name: pi.name, team: pi.team, bid: pi.bid, lv: pi.lv, d: BR[pi.bid], bot: pi.bot,
      g: pi.g, sp: pi.sp, hyOk: pi.hyOk, buf: pi.buf || {}, maxHp: pi.maxHp, hp: pi.maxHp, x: pi.x, y: pi.y, r: 0.42,
      ang: pi.team === 1 ? Math.PI / 2 : -Math.PI / 2, alive: true, st: { inv: 0, sh: 0, stun: 0, slow: 0, spd: 0 },
      inBush: false, reveal: 0, prot: 0, hyT: 0, sup: 0, hyp: 0, ammo: 3, gems: 0, cubes: 0, kills: 0, deaths: 0, respawn: 0, rank: 0,
      gUses: 0, gCd: 0, spd: 2.5, moving: false, hurtT: 0, dashing: false, slash: false, vx: 0, vy: 0,
    }));
    this.projs = []; this.zones = []; this.objs = []; this.items = []; this.gas = null;
    this.ms = { ph: 'count', ct: 3, tl: 0, sc: [0, 0], gc: [0, 0], cd: null, al: this.players.length };
    this.snaps = []; this.off = null; this.lastTm = 0;
    this.me = this.players[meId]; this.meId = meId;
    this.pred = { x: this.me.x, y: this.me.y, r: 0.42 }; this.corr = { x: 0, y: 0 }; this.pend = []; this.seq = 0;
    this.lobT = {};
  }
  get phase() { return this.ms.ph; }
  onSnap(s) {
    const now = performance.now() / 1000;
    s.rt = now; s.done = false;
    const est = s.tm - now;
    this.off = this.off == null ? est : Math.max(est, this.off - 0.003);
    this.snaps.push(s);
    if (this.snaps.length > 40) this.snaps.shift();
    // latest-state fields
    this.ms = s.M;
    this.gas = s.M.gas ? { x0: s.M.gas[0], y0: s.M.gas[1], x1: s.M.gas[2], y1: s.M.gas[3] } : null;
    for (const row of s.P) {

      if (me.g >= 0) items.push({ b: { x: bx - 70 * u, y: by, r }, fill: '#2fe39a', ring: '#2fe39a', f: null, lab: String(me.gUses), dim: me.gUses <= 0 || me.gCd > 0, key: 'Q' });
      if (me.hyOk) items.push({ b: { x: bx - 140 * u, y: by, r }, fill: '#b45cff', ring: '#d29bff', f: me.hyp, lab: 'H', dim: me.hyp < 1 && me.hyT <= 0, key: 'F' });
      for (const it of items) { btn(it.b, it.fill, it.ring, it.f, it.lab, it.dim); R.text(it.key, it.b.x, it.b.y + r + 14 * u, 10 * u, '#dfe3ff'); }
      if (this.hudT < 9) { this.hudT += dt; c.globalAlpha = clamp(9 - this.hudT, 0, 1); R.text('WASDで移動 · クリックで攻撃 · 右クリック/Spaceで必殺技', Safe.l + 16, Hd - Safe.b - 24 * u, 13 * u, '#fff', 'left'); c.globalAlpha = 1; }
    }
  }
  myOutcome() {
    const W = this.W, me = this.me();
    let win;
    if (this.kind === 'client') win = this.endRes ? this.endRes.win : null;
    else win = W.result ? W.result.win : null;
    if (W.mode === 'survival') {
      const rank = me.rank || (me.alive ? 1 : W.players.length);
      return { outcome: rank === 1 ? 'win' : 'lose', rank };
    }
    if (win == null) return { outcome: 'draw' };
    return { outcome: win === -1 ? 'draw' : win === me.team ? 'win' : 'lose' };
  }
  finishMine(left) {
    if (this.resultDone) return;
    this.resultDone = true;
    const me = this.me(), W = this.W;
    const o = left ? { outcome: 'lose', rank: W.mode === 'survival' ? (W.players.filter(p => p.alive).length) : 0 } : this.myOutcome();
    const res = {
      mode: W.mode, mapName: W.mapName, outcome: o.outcome, rank: o.rank || 0, bid: me.bid, kills: me.kills, me: me.id, team: me.team, online: this.kind !== 'local', left: !!left,
      players: W.players.map(p => ({ id: p.id, name: p.name, bid: p.bid, lv: p.lv, team: p.team, kills: p.kills, deaths: p.deaths, rank: p.rank || (p.alive ? 1 : 0), bot: p.bot })),
    };
    const rw = matchRewards(res);
    Input.enabled = false; Input.reset();
    if (this.kind === 'local') this.dispose();
    else if (this.kind === 'client') { this.session.close(); this.dispose(); }
    else if (this.kind === 'host') {
      // keep simulating in the background for remote players until the match ends
      if (this.sim.phase === 'end' || !this.session.clients.length) this.dispose();
      else {
        if (me.alive && !me.bot) { me.bot = true; me.skill = 0.5; this.bots.push(new Bot(me)); }
        Game.bg = this;
      }
    }
    Game.match = null;
    UI.showResult(res, rw);
  }
  dispose() {
    if (this.disposed) return;
    this.disposed = true;
    if (this.iv) clearInterval(this.iv);
    if (this.kind === 'host' && this.session) {
      if (!this.ended) this.session.broadcast({ t: 'end', r: { win: -1 } });
      this.session.close();
    }
    if (Game.bg === this) Game.bg = null;
    if (Game.match === this) Game.match = null;
  }
}

/* ============================================================
   Game glue
   ============================================================ */
const Safe = {
  l: 0, r: 0, t: 0, b: 0,
  measure() {
    const el = document.getElementById('safe'); if (!el) return;
    const cs = getComputedStyle(el);
    this.t = parseFloat(cs.paddingTop) || 0; this.r = parseFloat(cs.paddingRight) || 0;
    this.b = parseFloat(cs.paddingBottom) || 0; this.l = parseFloat(cs.paddingLeft) || 0;
  },
};

const Game = {
  match: null, bg: null, state: 'menu', last: 0, toastT: null,
  init() {
    R.init(); Safe.measure();
    addEventListener('resize', () => Safe.measure());
    Input.init(R.cv);
    Profile.load(); Snd.on = Profile.d.sound;
    UI.init();
    if (document.fonts && document.fonts.load) { document.fonts.load('20px "Dela Gothic One"').catch(() => {}); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) Input.reset(); });
    window.addEventListener('beforeunload', () => { if (this.bg) this.bg.dispose(); if (this.match) this.match.dispose(); });
    requestAnimationFrame(t => this.loop(t));
  },
  loop(t) {
    const dt = Math.min(0.1, (t - (this.last || t)) / 1000);
    this.last = t;
    try {
      if (this.match && this.state === 'match') this.match.frame(dt);
      else UI.frame(dt);
    } catch (e) { console.error(e); }
    requestAnimationFrame(tt => this.loop(tt));
  },
  toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('on');
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() => el.classList.remove('on'), 2600);
  },
  battle() {
    if (!Profile.owned(Profile.d.sel)) Profile.d.sel = 'haruto';
    if (this.bg) { this.bg.dispose(); this.bg = null; }
    const play = Profile.d.play;
    if (play !== 'bots' && NO_ONLINE) {
      UI.modalCb = null;
      UI.modal('<h2 class="disp">オンライン非対応</h2><p>この画面ではブラウザ同士の通信（WebRTC）が使えないため、オンライン対戦とフレンドルームは遊べません。公開ページを普通のブラウザで開くとオンラインで遊べます。</p><div class="row"><button class="btn k" data-act="closeModal">閉じる</button><button class="btn g" data-act="modalOk">ボット戦で遊ぶ</button></div>');
      UI.modalCb = () => this.startOffline();
      return;
    }
    if (play === 'bots') this.startOffline();
    else if (play === 'room') UI.roomMenu();
    else UI.startQuick();
  },
  startOffline() {
    const mode = Profile.d.mode, md = MODES[mode];
    const rnd = mulberry32((Math.random() * 1e9) | 0);
    const humans = [{ name: Profile.d.name, lo: Profile.loadout(), host: true }];
    const roster = buildRoster(mode, humans, true, rnd);
    const sim = new Sim({ mode, mapId: pick(md.maps, rnd), players: roster, seed: (rnd() * 1e9) | 0 });
    const me = roster.findIndex(r => r.human);
    this.startMatch({ kind: 'local', sim, me });
  },
  startMatch(o) {
    if (this.match) this.match.dispose();
    UI.online = null;
    UI.closeModal();
    Input.reset(); Input.enabled = true;
    this.state = 'match';
    this.match = new Match(o);
    UI.root.innerHTML = '<div class="scr clear"><div class="hud-top"><button class="btn k sm ico-btn" data-act="pause" aria-label="メニュー">II</button></div></div>';
    UI.scr = 'hud';
  },
  pauseMenu() {
    const m = this.match; if (!m) return;
    UI.modal('<h2 class="disp">メニュー</h2><p>' + (m.kind === 'local' ? 'ボット戦' : 'オンライン対戦') + '中です。試合を抜けると負け扱いになります。</p><div class="row"><button class="btn k" data-act="closeModal">試合に戻る</button><button class="btn r" data-act="leaveMatch">試合を抜ける</button></div>');
  },
  leaveMatch() {
    const m = this.match; if (!m) return;
    if (m.ended) { m.finishMine(); return; }
    m.finishMine(true);
  },
};

window.addEventListener('DOMContentLoaded', () => Game.init());

</script>
