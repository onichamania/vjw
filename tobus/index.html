<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>都バス現在地</title>
<meta name="theme-color" content="#0f5c3e">
<style>
:root{
  --bg:#f4f1ea; --surface:#ffffff; --surface2:#ebe7dd; --ink:#1d2421; --muted:#6b726e;
  --line:#d8d3c7; --accent:#0f5c3e; --accent-ink:#ffffff; --accent-soft:#dcebe3;
  --warn:#9a4b00; --warn-soft:#fbead8;
  --m-mitsu:#c8322f; --m-isuzu:#2a5fb0; --m-hino:#1d8a5a; --m-toyota:#454b52; --m-other:#c27a14;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --surface:#1b201e; --surface2:#242a27; --ink:#e7ece9; --muted:#97a19c;
    --line:#2f3733; --accent:#5fc29a; --accent-ink:#0b1712; --accent-soft:#1f3a2e;
    --warn:#f0a35a; --warn-soft:#3a2614;
    --m-mitsu:#ff7b72; --m-isuzu:#7aa7ff; --m-hino:#5fd39b; --m-toyota:#b5bcc3; --m-other:#f2b45a;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1b201e; --surface2:#242a27; --ink:#e7ece9; --muted:#97a19c;
  --line:#2f3733; --accent:#5fc29a; --accent-ink:#0b1712; --accent-soft:#1f3a2e;
  --warn:#f0a35a; --warn-soft:#3a2614;
  --m-mitsu:#ff7b72; --m-isuzu:#7aa7ff; --m-hino:#5fd39b; --m-toyota:#b5bcc3; --m-other:#f2b45a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--accent);color:var(--accent-ink);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top-inner{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:transparent;border:0;padding:6px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;min-width:36px;min-height:36px}
.iconbtn:active{background:rgba(255,255,255,.15)}
.iconbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.status{font-size:12px;opacity:.85;white-space:nowrap}
.search{margin:14px 0 8px;position:relative}
.search input{width:100%;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.hint{color:var(--muted);font-size:13px;margin:4px 2px 12px}
.sec-title{font-size:13px;color:var(--muted);margin:18px 2px 6px;font-weight:600}
.routes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.route{display:block;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.route b{display:block;font-size:17px}
.route span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route:active{background:var(--surface2)}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:16px 0}
.msg.warn{background:var(--warn-soft);border-color:transparent;color:var(--ink)}
.msg .btn{margin-top:10px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 10px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;max-width:260px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip small{display:block;font-size:11px;opacity:.75}
.chip .t{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--surface2);color:var(--ink);font-size:12px;text-align:center;margin-left:6px;font-weight:700}
.chip.on .count{background:rgba(255,255,255,.25);color:inherit}
.line{position:relative;margin:6px 0 0;padding:0}
.stop,.gap{position:relative;display:flex;align-items:flex-start;min-height:44px;padding-left:44px}
.gap{min-height:0;padding-top:4px;padding-bottom:4px}
.stop::before,.gap::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:4px;background:var(--accent);opacity:.35}
.stop.first::before{top:20px}
.stop.last::before{bottom:auto;height:20px}
.dot{position:absolute;left:12px;top:13px;width:18px;height:18px;border-radius:50%;background:var(--surface);border:4px solid var(--accent)}
.stop.term .dot{background:var(--accent)}
.stop .name{padding:10px 0;font-size:15px}
.stop.term .name{font-weight:700}
.gap .buses{display:flex;flex-direction:column;gap:6px;width:100%}
.gap.at{margin-top:-8px}
.stop:not(.last)::after{content:"";position:absolute;left:16px;top:32px;width:7px;height:7px;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent);transform:rotate(45deg);opacity:.7}
.dirbar{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border-radius:12px;padding:10px 12px;margin:2px 0 8px;font-size:14px}
.dirbar svg{width:26px;height:26px;flex:0 0 auto;stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.dirbar b{font-size:16px}
.dirbar small{display:block;color:var(--muted);font-size:12px}
.gap.at.end::before{display:none}
.legend{font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;background:var(--muted);margin:0 3px 0 0;vertical-align:-1px}
.bus{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--mk,var(--m-other));border-radius:10px;padding:8px 10px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bus:active{background:var(--surface2)}
.bus .no{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.bus .md{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.bus .age{font-size:12px;color:var(--muted);white-space:nowrap}
.bus.stale{opacity:.55}
.bus svg{width:18px;height:18px;flex:0 0 auto;stroke:var(--mk,var(--m-other));fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.gap .bus{position:relative}
.gap .bus::before{content:"";position:absolute;left:-34px;top:50%;width:20px;height:22px;margin-top:-11px;background:var(--mk,var(--m-other));clip-path:polygon(28% 0,72% 0,72% 48%,100% 48%,50% 100%,0 48%,28% 48%)}
.bus .arw{width:26px;height:26px;flex:0 0 auto;border-radius:50%;background:var(--mk,var(--m-other));display:inline-flex;align-items:center;justify-content:center}
.bus .arw svg{width:16px;height:16px;stroke:var(--surface);stroke-width:3}
.bus .pos{display:block;font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bus .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.bus .txt .md{flex:none}
.list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.empty{color:var(--muted);text-align:center;padding:24px 0}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.4)}
.sheet{padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 2px;font-size:24px;font-variant-numeric:tabular-nums}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:7.5em 1fr;gap:6px 10px;font-size:15px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);margin-left:6px}
.sheet .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.field{display:block;margin:10px 0}
.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field input{width:100%;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
footer.credit{color:var(--muted);font-size:11px;margin-top:28px;line-height:1.6}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.tabs{display:flex;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin:14px 0 4px}
.tab{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 0;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer}
.tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.fchips{display:flex;flex-wrap:wrap;gap:6px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tog{display:flex;align-items:center;gap:8px;font-size:14px;margin:14px 2px 0}
.tog input{width:18px;height:18px;accent-color:var(--accent)}
.bus.off .arw{background:var(--surface2)}
.bus.off .arw svg{stroke:var(--muted)}
.bus.off .pos{color:var(--muted)}
.bus.focus{outline:3px solid var(--accent);outline-offset:2px}
.hist{list-style:none;margin:6px 0 0;padding:0;font-size:14px}
.hist li{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.hist li span:first-child{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.sheet{max-height:85vh;overflow-y:auto}
.hidden{display:none!important}
.fav{background:transparent;border:0;cursor:pointer;padding:6px}
.fav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2}
.fav.on svg{fill:currentColor}
</style>
</head>

<main class="wrap">

</main>

  const out = { raw: String(raw == null ? "" : raw), depot, year, num,
    depotName: depot ? (DEPOT[depot] || null) : null,
    yearAD: year ? (YEAR[year] || null) : null, fleet: null, cls: null,
    label: depot && year && num != null ? `${depot}-${year}${String(num).padStart(3,"0")}`
         : year && num != null ? `${year}${String(num).padStart(3,"0")}` : String(raw == null ? "" : raw) };
  if (year && num != null) {
    const f = FLEET.find(r => r[0] === year && num >= r[1] && num <= r[2]);
    if (f) out.fleet = { maker:f[3], model:f[4], type:f[5], note:f[6] };
    out.cls = num <= 48 ? "貸切車" : num <= 99 ? "小型車" : num <= 899 ? "路線車" : "特殊車";
  }
  return out;
}

function idbOpen(){

    r.onsuccess = () => res(r.result);

  });
}

  catch(e){ return undefined; }
}
async function idbSet(k, v){

  catch(e){}
}
async function idbDel(k){
  try { const db = await idbOpen(); await new Promise(res => { const t = db.transaction("kv","readwrite"); t.objectStore("kv").delete(k); t.oncomplete = res; t.onerror = res; }); }

}

function ageText(sec){ if (sec < 0) sec = 0; if (sec < 60) return sec + "秒前"; if (sec < 3600) return Math.floor(sec/60) + "分前"; if (sec < 86400) return Math.floor(sec/3600) + "時間前"; return Math.floor(sec/86400) + "日前"; }

let relay = ls.get("relay", "");
let useRelay = false;
class CorsError extends Error {}
async function fetchJSON(url){
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
  return r.json();
}
async function getJSON(path){
  const direct = API + path;
  const viaRelay = () => fetchJSON(relay.replace(/\/+$/,"") + "/?url=" + encodeURIComponent(direct));
  if (useRelay && relay) return viaRelay();
  try { return await fetchJSON(direct); }
  catch(e){
    if (e.status) throw e;           // サーバーが応答した（CORS問題ではない）
    if (relay) { const j = await viaRelay(); useRelay = true; return j; }
    throw new CorsError(e.message);
  }
}
async function getAllByOperator(type){
  let list = null;
  try { list = await getJSON(`${type}?odpt:operator=${OP}`); } catch(e){ if (e instanceof CorsError) throw e; }
  if (Array.isArray(list) && list.length > 0 && list.length < 1000) return list;
  const all = await getJSON(`${type}.json`);
  return (Array.isArray(all) ? all : []).filter(opMatch);
}

let S = null; // {patterns:{id:{...}}, poles:{id:[name,lat,lon]}, routes:[...]}
async function loadStatic(force){
  if (!force) {
    const c = await idbGet(STATIC_KEY);
    if (c && Date.now() - c.ts < STATIC_TTL && c.patterns) return build(c);
  }
  setStatus('<span class="spin"></span>初回データ取得中');
  const [pats, poles] = await Promise.all([getAllByOperator("odpt:BusroutePattern"), getAllByOperator("odpt:BusstopPole")]);
  const P = {};
  for (const p of pats) {
    const id = p["owl:sameAs"] || p["@id"]; if (!id) continue;
    const ord = (p["odpt:busstopPoleOrder"] || []).slice().sort((a,b) => (a["odpt:index"]||0) - (b["odpt:index"]||0)).map(o => o["odpt:busstopPole"]).filter(Boolean);
    P[id] = { id, title: titleOf(p), route: p["odpt:busroute"] || "", dir: p["odpt:direction"] || "", note: p["odpt:note"] || "", poles: ord };
  }
  const B = {};
  for (const b of poles) {
    const id = b["owl:sameAs"] || b["@id"]; if (!id) continue;
    B[id] = [titleOf(b), b["geo:lat"], b["geo:long"]];
  }
  const c = { ts: Date.now(), patterns: P, poles: B };
  if (Object.keys(P).length) await idbSet(STATIC_KEY, c);
  return build(c);
}
function routeLabelFrom(pats, routeId){
  const cnt = {};
  for (const p of pats) {
    const tok = (p.title || "").split(/[:：\s　(（\[［]/)[0];
    if (tok) cnt[tok] = (cnt[tok] || 0) + 1;
  }
  const best = Object.entries(cnt).sort((a,b) => b[1]-a[1])[0];
  if (best) return best[0];
  return (routeId.split(".").pop() || routeId);
}
function build(c){
  const byRoute = {};
  for (const p of Object.values(c.patterns)) {
    const r = p.route || ("pattern:" + p.id);
    (byRoute[r] = byRoute[r] || []).push(p);
  }
  const poleName = id => (c.poles[id] && c.poles[id][0]) || shortId(id);
  const routes = Object.entries(byRoute).map(([id, pats]) => {
    const label = routeLabelFrom(pats, id);
    const main = pats.slice().sort((a,b) => b.poles.length - a.poles.length)[0];
    const ends = main && main.poles.length ? `${poleName(main.poles[0])}〜${poleName(main.poles[main.poles.length-1])}` : "";
    const stopNames = new Set(); pats.forEach(p => p.poles.forEach(x => stopNames.add(poleName(x))));
    return { id, label, ends, pats, search: norm(label + " " + ends + " " + [...stopNames].join(" ")) };
  }).sort((a,b) => a.label.localeCompare(b.label, "ja", { numeric:true }));
  S = { patterns: c.patterns, poles: c.poles, routes, routeById: Object.fromEntries(routes.map(r => [r.id, r])), poleName };
  return S;
}
const norm = s => String(s == null ? "" : s).normalize("NFKC").toLowerCase();
const shortId = id => String(id || "").split(".").pop();

function renderLine(p){
  if (!p) { $("lineArea").innerHTML = '<div class="empty">系統データがありません</div>'; return; }
  const idx = new Map(p.poles.map((id, i) => [id, i]));
  const at = {}, between = {}, unknown = [];
  for (const b of busesOn(p.id)) {
    const f = idx.get(b["odpt:fromBusstopPole"]), t = idx.get(b["odpt:toBusstopPole"]);
    if (f != null && t != null && t > f) (between[f] = between[f] || []).push(b);
    else if (f != null && (t == null || t === f)) (at[f] = at[f] || []).push(b);
    else if (f == null && t != null && t > 0) (between[t-1] = between[t-1] || []).push(b);
    else if (f == null && t === 0) (at[0] = at[0] || []).push(b);
    else unknown.push(b);
  }
  const n = p.poles.length, rows = [];
  p.poles.forEach((pid, i) => {

let seen = ls.get("seen", {}); // {番号: [[系統, パターン, 最初に見た時刻, 最後に見た時刻], ...]}
function recordSeen(list){
  const now = Date.now();
  for (const b of list) {
    const label = decodeNo(b["odpt:busNumber"]).label; if (!label) continue;
    const r = routeIdOf(b), p = b["odpt:busroutePattern"] || "";
    let t = Date.parse(b["dc:date"]); if (isNaN(t)) t = now;
    const h = seen[label] || (seen[label] = []); const last = h[h.length-1];
    if (last && last[0] === r && last[1] === p && t - last[3] < 90 * 60000) last[3] = Math.max(last[3], t);
    else { h.push([r, p, t, t]); if (h.length > 12) h.splice(0, h.length - 12); }
  }
  ls.set("seen", seen);
}
function fmtWhen(ts){
  const d = new Date(ts), day = x => x.toLocaleDateString("ja-JP", { timeZone:"Asia/Tokyo" });
  const hm = fmtTime(d).slice(0,5);
  return day(d) === day(new Date()) ? hm : d.toLocaleDateString("ja-JP", { timeZone:"Asia/Tokyo", month:"numeric", day:"numeric" }) + " " + hm;
}
function histHtml(label){
  const h = (seen[label] || []).slice().reverse();
  if (!h.length) return '<div class="hint">まだ記録がありません。</div>';
  return `<ul class="hist">${h.map(([r, p, s, e]) => {
    const pat = S.patterns[p], dest = pat && pat.poles.length ? S.poleName(pat.poles[pat.poles.length-1]) : "";
    return `<li><span>${fmtWhen(s)}${e - s >= 60000 ? "〜" + fmtTime(new Date(e)).slice(0,5) : ""}</span><span><b>${esc(routeName(r))}</b>${dest ? "　" + esc(dest) + "行" : ""}</span></li>`;
  }).join("")}</ul>`;
}

}
function openBus(id){
  const b = cur.buses.find(x => busKey(x) === id) || allBuses.find(x => busKey(x) === id); if (!b) return;
  openVehicle(decodeNo(b["odpt:busNumber"]).label, b);
}

/* ===== 画面：車両から探す ===== */
let homeTab = ls.get("tab", "route");
let allBuses = [], allAt = null, carTimer = null, carBusy = false, runByLabel = new Map();
const F = { maker:null, model:null, year:null };
const CAR_MAX = 400;
const BUS_ICON = '<svg viewBox="0 0 24 24" style="stroke-width:2.2"><rect x="4" y="3" width="16" height="15" rx="3"/><path d="M4 11h16M8 21v-3M16 21v-3"/></svg>';
const normNo = s => String(s == null ? "" : s).normalize("NFKC").toUpperCase().replace(/[\s\-‐ー－―]/g, "");
function showTab(t){
  homeTab = t; ls.set("tab", t);
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.tab === t));
  $("carTab").classList.toggle("hidden", t !== "car");
  $("routeTab").classList.toggle("hidden", t === "car");
  if (t === "car") { renderCars(); if (!cur.route) refreshCars(); startCarTimer(); }
  else { stopCarTimer(); if (!cur.route) setStatus(""); }
}
function startCarTimer(){ stopCarTimer(); carTimer = setInterval(() => { if (!document.hidden && !cur.route && homeTab === "car") refreshCars(); }, REFRESH_SEC * 1000); }
function stopCarTimer(){ if (carTimer) clearInterval(carTimer); carTimer = null; }
async function refreshCars(){
  if (carBusy) return;
  carBusy = true;
  setStatus('<span class="spin"></span>更新中');
  try {
    allBuses = await getAllByOperator("odpt:Bus"); allAt = new Date();
    recordSeen(allBuses);
    $("carMsg").innerHTML = "";
    if (!cur.route) { renderCars(); setStatus(fmtTime(allAt).slice(0,5) + " 更新"); }
  } catch(e){
    if (!cur.route) { setStatus("取得失敗"); showError($("carMsg"), e); }
  } finally { carBusy = false; }
}
function fitsF(d){
  if (F.maker && (!d.fleet || d.fleet.maker !== F.maker)) return false;
  if (F.model && (!d.fleet || d.fleet.model !== F.model)) return false;
  if (F.year && d.year !== F.year) return false;
  return true;
}
function renderFilters(){
  const okM = f => !F.maker || f[3] === F.maker;
  const makers = [...new Set(FLEET.map(f => f[3]))];
  const models = [...new Set(FLEET.filter(okM).map(f => f[4]))];
  const years = new Set(FLEET.filter(f => okM(f) && (!F.model || f[4] === F.model)).map(f => f[0]));
  if (!F.maker && !F.model) for (const l of runByLabel.keys()) { const y = decodeNo(l).year; if (YEAR[y]) years.add(y); }
  const chip = (k, v, text) => `<button class="fchip${F[k] === v ? " on" : ""}" data-fk="${k}" data-fv="${esc(v)}">${esc(text)}</button>`;
  $("fMaker").innerHTML = makers.map(m => chip("maker", m, m)).join("");
  $("fModel").innerHTML = models.map(m => chip("model", m, m)).join("");
  $("fYear").innerHTML = [...years].sort((a,b) => YEAR[b] - YEAR[a]).map(y => chip("year", y, `${YEAR[y]}（${y}）`)).join("");
}
function setFilter(k, v){
  F[k] = F[k] === v ? null : v;
  if (F.model && !FLEET.some(f => f[4] === F.model && (!F.maker || f[3] === F.maker))) F.model = null;
  if (F.year && (F.maker || F.model) && !FLEET.some(f => f[0] === F.year && (!F.maker || f[3] === F.maker) && (!F.model || f[4] === F.model))) F.year = null;
  renderCars();
}
function carRow(l, b){
  const d = decodeNo(l);
  const mk = d.fleet ? (MAKER_VAR[d.fleet.maker] || "--m-other") : "--m-other";
  const md = d.fleet ? `${d.fleet.maker} ${d.fleet.model}` : (d.yearAD ? `${d.yearAD}年度車` : "車種不明");
  let pos;
  if (b) {
    const dest = destOf(b), to = b["odpt:toBusstopPole"] ? S.poleName(b["odpt:toBusstopPole"]) : "";
    pos = `<b>${esc(routeName(routeIdOf(b)))}</b>${dest ? "　" + esc(dest) + "行" : ""}${to ? "・次 " + esc(to) : ""}`;
  } else {
    const h = seen[l], last = h && h[h.length-1];
    pos = "運行データなし" + (last ? `（最後：${esc(routeName(last[0]))} ${ageText(Math.round((Date.now() - last[3]) / 1000))}）` : "");
  }
  return `<button class="bus${b ? "" : " off"}" style="--mk:var(${mk})" data-v="${esc(l)}"><span class="arw">${b ? ARW_RIGHT : BUS_ICON}</span>
    <span class="no">${esc(l)}</span><span class="txt"><span class="pos">${pos}</span><span class="md">${esc(md)}</span></span></button>`;
}
function renderCars(){
  if (!S) return;
  runByLabel = new Map();
  for (const b of allBuses) { const l = decodeNo(b["odpt:busNumber"]).label; if (l) runByLabel.set(l, b); }
  renderFilters();
  const q = normNo($("cq").value.trim());
  const all = !$("onlyRun").checked || !!q; // 番号で探すときは運行していない車両も出す
  const cand = new Set(runByLabel.keys());
  if (all) {
    for (const f of FLEET) if ((!F.maker || f[3] === F.maker) && (!F.model || f[4] === F.model) && (!F.year || f[0] === F.year))
      for (let n = f[1]; n <= f[2]; n++) cand.add(f[0] + String(n).padStart(3, "0"));
    Object.keys(seen).forEach(l => cand.add(l));
  }
  const list = [...cand].filter(l => (!q || normNo(l).includes(q)) && fitsF(decodeNo(l)))
    .map(l => { const d = decodeNo(l); return { l, y: d.yearAD || 0, n: d.num || 0 }; })
    .sort((a,b) => b.y - a.y || a.n - b.n).map(x => x.l);
  const nRun = list.filter(l => runByLabel.has(l)).length;
  $("carTitle").textContent = allAt ? `${list.length}台（うち運行中 ${nRun}台）` : "運行データを取得中…";
  if (!list.length) { $("carList").innerHTML = `<div class="empty">${allAt ? "見つかりませんでした" : '<span class="spin"></span>'}</div>`; return; }
  $("carList").innerHTML = list.slice(0, CAR_MAX).map(l => carRow(l, runByLabel.get(l))).join("")
    + (list.length > CAR_MAX ? `<div class="hint">ほか ${list.length - CAR_MAX}台。メーカー・車種・年度で絞り込んでください。</div>` : "");
}

/* ===== お気に入り・設定 ===== */
function updateFavBtn(){ const on = cur.route && ls.get("favs", []).includes(cur.route.id); $("favBtn").classList.toggle("on", !!on); }
$("favBtn").onclick = () => {
  if (!cur.route) return;
  let f = ls.get("favs", []); const id = cur.route.id;
  f = f.includes(id) ? f.filter(x => x !== id) : [id, ...f];
  ls.set("favs", f); updateFavBtn();
};
function openSettings(){ $("relayInput").value = relay; $("setSheet").showModal(); }
window.openSettings = openSettings;
$("setBtn").onclick = openSettings;
$("saveSet").onclick = () => { relay = $("relayInput").value.trim(); ls.set("relay", relay); useRelay = false; $("setSheet").close(); location.reload(); };
$("clearCache").onclick = async () => { await idbDel(STATIC_KEY); location.reload(); };
for (const id of ["busSheet","setSheet"]) $(id).addEventListener("click", e => { if (e.target === $(id)) $(id).close(); });

/* ===== 画面遷移 ===== */
function parseHash(){ const h = new URLSearchParams(location.hash.slice(1)); return { r: h.get("r"), p: h.get("p"), f: h.get("f") }; }
function go(r, p, f){ const h = new URLSearchParams(); if (r) h.set("r", r); if (p) h.set("p", p); if (f) h.set("f", f); location.hash = h.toString(); }
function route(){
  if (!S) return;
  const { r, p, f } = parseHash();
  if (r) {
    if (!cur.route || cur.route.id !== r) openRoute(r, p, f);
    else { if (p) cur.pattern = p; if (f) { cur.focus = f; cur.focusDone = false; } renderRoute(); }
  }
  else if (cur.route) closeRoute();
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  const gb = e.target.closest("[data-gr]"); if (gb) { $("busSheet").close(); go(gb.dataset.gr, gb.dataset.gp, gb.dataset.gf); return; }
  const tb = e.target.closest("[data-tab]"); if (tb) { showTab(tb.dataset.tab); return; }
  const fb = e.target.closest("[data-fk]"); if (fb) { setFilter(fb.dataset.fk, fb.dataset.fv); return; }
  const vb = e.target.closest("[data-v]"); if (vb) { openVehicle(vb.dataset.v, runByLabel.get(vb.dataset.v)); return; }
  const rb = e.target.closest("[data-r]"); if (rb) { go(rb.dataset.r); return; }
  const pb = e.target.closest("[data-p]"); if (pb && cur.route) { cur.pattern = pb.dataset.p; history.replaceState(null, "", "#" + new URLSearchParams({ r: cur.route.id, p: cur.pattern }).toString()); renderRoute(); return; }
  const bb = e.target.closest("[data-b]"); if (bb) { openBus(bb.dataset.b); return; }
});
$("backBtn").onclick = () => { if (history.length > 1 && parseHash().r) history.back(); else go(null); };
$("reloadBtn").onclick = () => { if (cur.route) refresh(); else if (homeTab === "car") refreshCars(); else location.reload(); };
$("q").addEventListener("input", () => S && renderHome());
$("cq").addEventListener("input", () => renderCars());
$("onlyRun").addEventListener("change", () => renderCars());
document.addEventListener("visibilitychange", () => { if (document.hidden) return; if (cur.route) refresh(); else if (homeTab === "car") refreshCars(); });

/* ===== 起動 ===== */
(async function init(){
  $("routeList").innerHTML = '<div class="empty"><span class="spin"></span>系統データを読み込み中（初回は少し時間がかかります）</div>';
  try {
    await loadStatic(false);
    setStatus("");
    if (!S.routes.length) throw new Error("系統データが空でした");
    renderHome();
    showTab(homeTab);
    route();
  } catch(e){
    setStatus("");
    $("routeList").innerHTML = "";
    showError($("homeMsg"), e);
  }
})();
</script>
</body>
</html>
